[project]
name = "retro"
version = "0.1.0"
description = "Fait remonter une bibliothèque de jeux rétro dans Steam"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "vdf>=3.4",
    "requests>=2.31",
    "py7zr>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
retro = "retro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# manifests/ et profiles/ sont des dossiers de données à la racine, pas des
# paquets Python. La découverte automatique de setuptools les voit comme des
# paquets et refuse de construire (« Multiple top-level packages discovered
# in a flat-layout ») : la liste est donc explicite.
[tool.setuptools.packages.find]
include = ["retro*"]

# Le paquet n'est rien sans ses données : un « retro install » sur une machine
# où manifests/ et profiles/ n'ont pas suivi n'a rien à installer et ne peut
# lancer aucun jeu. Elles vivent à la racine du dépôt, hors du paquet Python,
# donc package-data ne s'applique pas : data-files est la voie qui les emporte.
[tool.setuptools.data-files]
"share/retro/manifests" = ["manifests/core.toml"]
"share/retro/profiles" = ["profiles/retroarch.toml", "profiles/dolphin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
