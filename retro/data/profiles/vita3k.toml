# Vita3K — PlayStation Vita.
#
# ✅ CET ÉMULATEUR S'INSTALLE ET TOURNE, depuis le 2026-08-29. Ce qui suit
# décrit COMMENT, parce que le chemin n'est pas celui des neuf autres profils.
#
# L'entrée du manifeste NOYAU (core.toml, [emulator.vita3k]) porte toujours une
# version et une empreinte VIDES, et cela ne changera pas : Vita3K ne publie
# qu'une étiquette roulante « continuous », dont l'archive est réécrite à
# chaque construction, et ce dépôt public refuse les étiquettes roulantes —
# une empreinte qui vieillit d'un jour ferait échouer l'installation sur la
# console sans que rien ne l'explique.
#
# L'entrée qui FONCTIONNE vit donc dans le manifeste du PROPRIÉTAIRE,
# G:\retro\emulators.toml, hors dépôt, où une empreinte peut être re-relevée
# quand elle périme. C'est la sortie que la dette D5 désignait elle-même, et
# `load_manifest` la rend possible sans rien changer ici : le manifeste
# utilisateur SURCHARGE le noyau par clé (`brut.update`).
#
# ⚠ CE PROFIL RESTE DONC INERTE POUR QUI N'A QUE LE PAQUET. Sans entrée dans
# un manifeste utilisateur, « retro install » refuse toujours (acquire.py, sur
# l'empreinte vide) et « retro scan » ignore puis SIGNALE le système Vita. Ce
# n'est pas une régression : c'est le refus délibéré, et il tient.
#
# Ce qui vient d'une source sûre, et laquelle :
#
# - les options de ligne de commande ont d'abord été lues dans
#   vita3k/config/src/config.cpp du dépôt du projet — une source plus faible
#   que celle des neuf autres profils. ELLES SONT DEPUIS CONFIRMÉES SUR
#   L'EXÉCUTABLE ÉPINGLÉ : « Vita3K.exe --help » a été relevé sur l'invité le
#   2026-08-29, et rend bien `content-path` en positionnel, `--fullscreen`,
#   `--firmware`, `--installed-path` et `--config-location`. La faiblesse de
#   source est levée ; les libellés ci-dessous sont ceux du binaire.
#     content-path  (positionnel) « Path to the app with a .vpk/.zip extension
#                   or folder of content to install & run » — c'est lui qui
#                   reçoit {rom}, et il accepte les DEUX formes d'une
#                   bibliothèque Vita, le fichier comme le dossier ;
#     --fullscreen, -F « Start the emulator in fullscreen mode. » ;
#     --installed-path, -r « Path to the installed app to run » — l'autre voie
#                   pour une application DÉJÀ installée dans le ux0: de
#                   Vita3K. SA FORME EST MESURÉE depuis le 2026-08-29, et ce
#                   n'est pas un chemin : config.cpp la valide par
#                   CLI::IsMember(get_file_set(vita_fs_path / "ux0/app")), qui
#                   rend les NOMS DE DOSSIERS de ux0/app — c'est donc le
#                   TITLE ID. Le profil ne s'en sert pas encore : `-r` échoue
#                   au parsing sur un titre absent de ux0/app, il ne peut donc
#                   pas servir aussi les jeux non installés.
#     --firmware    « Path to the firmware file (.pup extension) to install »
#                   — voir la section BIOS plus bas ;
#     -c, --config-location « Default loaded: <Vita3K>/config.yml » : la
#                   configuration de Vita3K vit À CÔTÉ de son exécutable.
#
# - L'ARCHIVE A ÉTÉ LISTÉE le 2026-08-29, et `exe` n'est plus une supposition :
#   133 entrées, 20 éléments à la racine, et « Vita3K.exe » EST à la racine, à
#   plat, sans dossier englobant — comme DuckStation, contrairement à
#   RetroArch, Dolphin et Cemu. Empreinte de l'archive relevée le même jour en
#   la téléchargeant, jamais recopiée d'une page.
#
# - ce qui reste À MESURER, et que rien ici n'invente :
#   la liste complète des extensions acceptées, et la forme d'une
#   bibliothèque Vita réelle — le propriétaire n'en a aucune aujourd'hui. Lu
#   le 2026-08-29 sur le PARTAGE lui-même, celui que le scan parcourt : un
#   dossier par constructeur puis par système, aucun dossier PS Vita. C'est
#   donc la seule chose que le partage puisse dire de cette forme-là : elle
#   n'existe pas encore, et ce profil la prévoit sans l'avoir vue.

schema = 1
id  = "vita3k"
exe = 'Vita3K.exe'

# DEUX RACINES, PAS UNE, et les confondre fait chercher un firmware au mauvais
# endroit. Mesuré le 2026-08-29, après installation réelle :
#
#   la CONFIGURATION est à côté de l'exécutable — D:\Emulation\Vita3K\config.yml
#   existe bel et bien, ce que « --config-location » annonce ;
#   les DONNÉES, elles, vont dans %APPDATA%\Vita3K\Vita3K\ — c'est là que
#   l'installation du firmware a déposé os0\ (69 fichiers) et vs0\ (1473).
#
# Rien dans l'aide ne le dit ; c'est le journal d'installation qui l'a montré
# (« Extracting … to C:\Users\…\AppData\Roaming\Vita3K\Vita3K\PUP_DEC »).

# AMORÇAGE — DEUX blocs, et ils ferment DEUX modales distinctes.
#
# Les deux modales de Vita3K ne vivent ni dans le même fichier ni dans le même
# format : celle des privilèges est un QSettings INI, celle des polices une clé
# d'un YAML. Les confondre poserait une clé qu'aucun lecteur ne lit — et rien
# ne le dirait. Le second bloc est plus bas.
#
# 🔴 LA PANNE : Vita3K avertit à CHAQUE lancement qu'il tourne avec des
# privilèges élevés — une boîte modale qu'aucune manette ne ferme, exactement
# comme la fenêtre de mise à jour de DuckStation. Toute la console tourne sous
# le compte super-utilisateur, donc elle revient à chaque partie. (Le message
# anglais n'est pas recopié : il contient une chaîne que le garde-fou du dépôt
# confond avec un nom d'émulateur interdit — voir docs/dettes.md, D7.)
#
# LA CLÉ, ET SA SOURCE — relevée dans le CODE de Vita3K, jamais dans une page
# de documentation ni dans les chaînes du binaire, qui donnent les libellés de
# l'interface et non les valeurs du fichier (leçon D2) :
#
#     gui_settings.h        gui::mw_warnAdminPrivileges — le nom de la clé et
#                           son groupe, « MainWindow »
#     main_window.cpp       prompt_admin_privileges_warning_if_needed, gardée
#                           par cette même clé
#
# VÉRIFIÉE PAR L'EFFET le 2026-08-29, et c'est la seule preuve qui vaille : la
# ligne « |W| prompt_admin_privileges_warning_if_needed » a disparu du journal,
# et la modale de l'écran — capture à l'appui, soixante-dix secondes après le
# lancement alors qu'elle sortait à quatorze secondes auparavant.
#
# LE FICHIER : <installation>\gui-configs\CurrentSettings.ini, un QSettings au
# format INI (gui::Settings = "CurrentSettings", écrit dans
# emuenv.config_path / "gui-configs"). C'est donc un fichier que la fusion de
# ce projet SAIT traiter — elle ne connaît que l'INI.
#
# ⚠ LA CIBLE VIT SOUS LE DOSSIER D'INSTALLATION, et cela a UNE conséquence
# qu'il faut lire avant de crier à la panne : « retro install » SUPPRIME ce
# dossier à chaque montée de version, donc le fichier disparaît avec lui. Le
# régime « si-absent » le repose au lancement suivant, et les clés imposées y
# reviennent. Ce n'est pas une régression : c'est l'auto-réparation que la
# conception avait prévue pour RetroArch et Cemu, et elle joue ici en notre
# faveur.
#
# POURQUOI `enforced` ET NON `content`. La case se recoche d'un clic dans
# l'interface de Vita3K, et « si-absent » ne rouvrirait jamais un fichier qui
# existe : la modale reviendrait pour de bon, sur une console déjà jouée, sans
# qu'aucun message ne fasse le lien. C'est très exactement le cas pour lequel
# les deux régimes ont été séparés.
#
# CE QUI RESTE À MESURER, et que ce bloc n'invente pas : tout le reste de la
# première configuration de Vita3K. Aucune autre clé n'entre ici sans avoir été
# relevée dans un fichier que l'émulateur a lui-même écrit — une clé recopiée
# d'une documentation est ignorée en silence, et le jeu ne démarre toujours
# pas. Voir docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.

[[bootstrap]]
# Le jeton {install_dir} est substitué à l'écriture du plan (retro/launcher.py,
# resoudre_cible). Il vaut la racine d'émulation suivie du dossier
# d'installation TEL QUE LE MANIFESTE le nomme : écrire « Vita3K » en clair ici
# réécrirait ce nom une seconde fois, et une surcharge du manifeste du
# propriétaire ferait rater la cible en silence.
target = '{install_dir}\gui-configs\CurrentSettings.ini'

# L'en-tête distingue les TROIS catégories, et ce n'est pas une formule : le
# propriétaire CROIT ce qu'il lit en tête d'un fichier de configuration et
# règle son comportement dessus. Une promesse qui survivrait au régime qui la
# rendait vraie serait pire qu'une absence d'en-tête.
#
# Rien d'autre que l'en-tête : aucune préférence de Vita3K n'a été mesurée à ce
# jour, et en inventer une la rendrait indiscernable d'un relevé.
content = '''
; Écrit par « retro », qui distingue trois choses :
;   · ce qu'il IMPOSE et repose à CHAQUE lancement — voir la section ci-dessous
;     du fichier des clés imposées ; la changer ici ne tiendrait pas ;
;   · ce qu'il a posé UNE FOIS, à la création de ce fichier, et ne retouche
;     plus jamais : vos réglages tiennent ;
;   · tout le reste, qui est à vous et qu'il ne lit même pas.
'''

# Une seule clé imposée, et une seule modale fermée. L'élargir, c'est reprendre
# au propriétaire un réglage qu'il croyait sien : il ne s'en apercevrait qu'en
# le voyant revenir après l'avoir changé.
enforced = '''
[MainWindow]
warnAdminPrivileges=false
'''

# LA LANGUE : aucune ici, et c'est mesuré.
#
# RELEVÉ le 2026-09-04 dans vita3k/gui-qt/include/gui-qt/gui_settings.h, qui
# énumère TOUTES les clés que ce fichier peut porter — onze groupes,
# `MainWindow`, `GameList`, `Logger`, `GameWindow`, `Trophy`, `Controls`,
# `Settings`, `UserManagement`, `VitaThemes`, `Meta`. Aucune n'est une langue.
#
# Les deux langues de Vita3K vivent dans son config.yml, la seconde cible de
# ce profil : `sys-lang` pour la console émulée — c'est celle que ce profil
# pose — et `user-lang` pour son interface, qui n'est pas déclarée et dont la
# raison est écrite là-bas.
langue_absente = """gui_settings.h en énumère TOUTES les clés que ce \
fichier peut porter, onze groupes, et aucune n'est une langue ; les deux \
langues de Vita3K (sys-lang, user-lang) vivent dans son config.yml"""

# LA SECONDE MODALE — le paquet de polices, et un fichier d'un AUTRE format.
#
# 🔴 LA PANNE, relevée le 2026-08-29 (dette D9) : Vita3K ouvre au lancement un
# avertissement « firmware incomplet » nommant le paquet de polices, avec un
# bouton « lancer quand même » et une case « ne plus prévenir ». Aucune manette
# ne la ferme. La case a été cochée à la main une fois — et comme les quatre
# réglages de D7, rien ne la repose.
#
# LA CLÉ, ET SA SOURCE — lue dans le CODE de Vita3K, jamais dans une page de
# documentation ni dans les chaînes du binaire, qui donnent les libellés de
# l'interface et non les valeurs du fichier (leçon D2) :
#
#     config/include/config/config.h
#         code(bool, "warn-missing-firmware", true, warn_missing_firmware)
#         — le nom EXACT de la clé, et son défaut : true. Ne rien poser laisse
#         donc la modale sortir à chaque partie.
#     gui-qt/src/main_window.cpp
#         confirm_missing_firmware_warning fait
#         emuenv.cfg.warn_missing_firmware = false; puis serialize_config(…)
#         — c'est CETTE clé-là que la case écrit, et pas celle de D7.
#     config/src/config.cpp, init_config
#         la clé n'est exposée par AUCUNE option de ligne de commande : le
#         fichier est la seule voie.
#
# ⚠ CE FICHIER EST UN YAML, et c'est ce qui a fait écrire le second dialecte
# de fusion (retro/profiles.py, cles_de). Une ligne posée en INI y serait
# ignorée en silence : la fusion exige un « = » et n'aurait rien vu.
#
# POURQUOI `enforced` ET NON `content`. Vita3K CRÉE lui-même son config.yml au
# premier lancement (init_config → serialize_config, config/src/config.cpp) :
# le régime « si-absent » ne se déclencherait donc JAMAIS, et la clé ne serait
# jamais posée. Seul le régime qui lit et fusionne s'applique ici.
#
# CE QUI N'ENTRE PAS DANS CE BLOC, et pourquoi :
#
#   `pref-path`, qui sortirait le système de fichiers Vita de %APPDATA%. Il
#   attend la mesure de la tâche 1 du plan D9 — la cause de l'échec de
#   `install_content` — parce qu'il n'est un remède que si cette cause est la
#   longueur ou le lieu de la destination. Et il a un piège propre : une valeur
#   non vide qui ne désigne pas un dossier EXISTANT fait refuser le démarrage
#   (« Cannot find Vita FS path »). Le dossier se crée avant, ou la console ne
#   démarre plus.
#
#   tout le reste de la configuration de Vita3K. Aucune clé n'entre ici sans
#   avoir été relevée dans la source ou dans un fichier que l'émulateur a
#   lui-même écrit.

[[bootstrap]]
# « -c, --config-location » annonce « Default loaded: <Vita3K>/config.yml » :
# la configuration vit À CÔTÉ de l'exécutable, donc sous le dossier
# d'installation. Le jeton, et non « Vita3K » en clair : ce nom se surcharge au
# manifeste du propriétaire, et le réécrire ici ferait rater la cible en
# silence.
target = '{install_dir}\config.yml'

# L'en-tête seul, en commentaire YAML — « # », pas « ; », qui n'est pas un
# commentaire dans ce format et corromprait le fichier. Aucune préférence : il
# n'en a été mesuré aucune, et en inventer une la rendrait indiscernable d'un
# relevé.
content = '''
# Écrit par « retro », qui distingue trois choses :
#   · ce qu'il IMPOSE et repose à CHAQUE lancement — la clé ci-dessous ; la
#     changer ici ne tiendrait pas ;
#   · ce qu'il a posé UNE FOIS, à la création de ce fichier, et ne retouche
#     plus jamais : vos réglages tiennent ;
#   · tout le reste, qui est à vous et qu'il ne lit même pas.
'''

# Une seule clé imposée, une seule modale fermée. Aucune marque de ligne n'est
# posée à côté d'elle : voir retro-launch.cs, MARQUE_FUSION — en YAML, la
# marque serait effacée à chaque régénération du fichier et reposée à chaque
# lancement, ce qui déposerait une sauvegarde de plus par partie.
enforced = '''
warn-missing-firmware: false
'''

# LA LANGUE SYSTÈME DE LA PS VITA — celle qu'un jeu interroge pour choisir la
# sienne, et la seule des deux qui se voie depuis le canapé.
#
# RELEVÉE le 2026-09-04 dans vita3k/config/include/config/config.h :
#
#     code(int, "sys-lang", static_cast<int>(SCE_SYSTEM_PARAM_LANG_ENGLISH_US),
#          sys_lang)
#
# ⚠ C'EST UN ENTIER, ET C'EST LE PIÈGE DE CE BLOC — le même que celui du cœur
# melonDS de RetroArch : un entier faux n'est pas une valeur invalide, c'est
# une AUTRE langue, parfaitement valide. Rien n'échoue, rien n'est journalisé,
# et le jeu démarre simplement dans une langue que personne n'a demandée. Un
# décalage d'un rang met le japonais là où l'anglais était attendu.
#
# LES ENTIERS VIENNENT DE vita3k/lang/src/lang.cpp,
# `locale_tag_for_sys_lang(int sys_lang)`, dont le tableau `locale_tags` est
# INDEXÉ PAR sys-lang. L'ordre y est celui de l'énumération Sony
# SCE_SYSTEM_PARAM_LANG_*, et les étiquettes en commentaire ci-dessous sont
# celles de ce tableau, recopiées rang par rang.
#
# CONFIRMÉ PAR UNE SECONDE SOURCE, INDÉPENDANTE, et c'est ce qui permet de
# déclarer un entier sans l'avoir vu agir : RPCS3 sérialise le MÊME
# vocabulaire Sony pour la PS3 (`fmt_class_string<CellSysutilLang>::format`,
# Emu/Cell/Modules/cellSysutil.cpp) et son ordre est identique rang pour rang —
# Japanese 0, English (US) 1, French 2, Spanish 3, German 4, Italian 5, Dutch
# 6, Portuguese (Portugal) 7, Russian 8, Korean 9, Chinese (Traditional) 10,
# Chinese (Simplified) 11, Finnish 12, Swedish 13, Danish 14, Norwegian 15,
# Polish 16, Portuguese (Brazil) 17, English (UK) 18, Turkish 19. Deux projets
# qui ne se copient pas et qui comptent pareil.
#
# `latam` PREND L'ESPAGNOL, rang 3, et c'est le seul choix que le matériel
# permette : la PS Vita n'a qu'un espagnol. C'est la convention déjà tenue par
# Dolphin pour la GameCube, et elle est écrite là-bas aussi.
#
# LE RANG 18 — English (UK) — N'EST DÉCLARÉ PAR AUCUNE LANGUE DE STEAM :
# Steam ne distingue pas les deux anglais, et `english` prend le rang 1.
#
# LES LANGUES DE STEAM QUE LA PS VITA N'A PAS — arabe, bulgare, tchèque, grec,
# hongrois, indonésien, malais, roumain, thaï, ukrainien, vietnamien — ne sont
# PAS déclarées, et pour la raison inverse de celle de Dolphin : là-bas
# l'interface de l'émulateur savait les afficher, donc chaque langue avait
# quelque chose à poser. Ici il n'y a qu'un axe. Les déclarer toutes à
# « sys-lang: 1 » écrirait vingt fois le repli sous vingt noms différents, et
# le rapport dirait « pose english » là où la vérité est « cette console n'a
# pas cette langue ». Elles prennent donc le repli, que « retro status » nomme
# une par une.
#
# `user-lang` — LA LANGUE DE L'INTERFACE DE VITA3K — N'EST PAS DÉCLARÉE, et
# c'est un refus, pas un oubli. Ses valeurs acceptées sont découvertes À
# L'EXÉCUTION dans les ressources livrées (`ui_language_options`,
# gui-qt/include/gui-qt/gui_language.h), donc elles sont une propriété de
# L'ARCHIVE — comme les `.qm` de RPCS3. Or l'archive de Vita3K n'est épinglée
# par AUCUNE empreinte au manifeste du projet : c'est l'étiquette roulante
# `continuous`, qui se réécrit à chaque construction (dette D5). Il n'existe
# donc aucun build fixe contre lequel relever ces valeurs, et une étiquette
# recopiée serait ignorée en silence.
[bootstrap.langue]
repli = "english"
japanese   = "sys-lang: 0"    # ja
english    = "sys-lang: 1"    # en
french     = "sys-lang: 2"    # fr
spanish    = "sys-lang: 3"    # es
latam      = "sys-lang: 3"    # es
german     = "sys-lang: 4"    # de
italian    = "sys-lang: 5"    # it
dutch      = "sys-lang: 6"    # nl
portuguese = "sys-lang: 7"    # pt-PT
russian    = "sys-lang: 8"    # ru
koreana    = "sys-lang: 9"    # ko
tchinese   = "sys-lang: 10"    # zh-Hant
schinese   = "sys-lang: 11"    # zh-Hans
finnish    = "sys-lang: 12"    # fi
swedish    = "sys-lang: 13"    # sv
danish     = "sys-lang: 14"    # da
norwegian  = "sys-lang: 15"    # no
polish     = "sys-lang: 16"    # pl
brazilian  = "sys-lang: 17"    # pt-BR
turkish    = "sys-lang: 19"    # tr

# Manette : « inconnu », et il ne peut rien y avoir d'autre aujourd'hui.
# Vita3K ne s'installe pas depuis ce manifeste — son empreinte est vide —
# donc personne n'a pu voir une manette repondre dans cet emulateur. Ce
# n'est PAS « il se debrouille » : le plan des manettes le supposait de
# DuckStation, et c'etait faux (dette D3). `retro status` le nomme sans
# l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans les émulateurs, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le
# gabarit d'entrée du sous-projet E. Le config.yml est désormais ATTEIGNABLE
# — le second bloc d'amorçage ci-dessus y écrit — mais cela ne change rien
# ici : le nom de la clé de vibration n'a été relevé dans AUCUNE source,
# ni dans le code, ni dans un fichier que Vita3K a lui-même écrit. Recopié d'une documentation, il serait
# ignoré en silence et la manette resterait muette exactement comme
# aujourd'hui. Ce qui reste à mesurer, sur la machine : ce que Vita3K écrit
# de lui-même une fois la vibration activée dans son interface.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# Rien de déclaré : aucune sortie manette n'a été mesurée, et l'annoncer
# avant serait une promesse que la console ne tiendrait pas. Le repli Steam
# Input reste la sortie garantie.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "vita"
name       = "PS Vita"
# Le propriétaire range par constructeur puis par système (« Sony\Playstation
# 1\ ») : ces noms sont ceux qu'il emploierait, pas une mesure. Il n'a aucune
# bibliothèque Vita aujourd'hui — le jour où il en aura une, le nom qu'il aura
# choisi se déclare ici, ou le dossier se renomme. « retro scan » nomme les
# dossiers qu'aucun profil ne reconnaît, précisément pour ça.
folders    = ["PSVita", "PS Vita", "PlayStation Vita", "Vita"]
# UNE BIBLIOTHÈQUE VITA NE PORTE QUE DES APPLICATIONS INSTALLÉES, et cette
# liste vide est le résultat d'une DESTRUCTION mesurée.
#
# Le profil couvrait auparavant deux formes : le .vpk, un FICHIER, et
# l'application installée, un DOSSIER. C'était une erreur, et voici pourquoi.
# L'aide de Vita3K décrit son argument positionnel ainsi :
#
#   content-path TEXT   Path to the app with a .vpk/.zip extension or folder
#                       of content to install & run
#
# « INSTALL and run » — le positionnel INSTALLE. Passer le dossier d'une
# application déjà installée la réinstalle donc par-dessus elle-même, et le
# 2026-08-30 cela l'a DÉTRUITE : après ce lancement, ux0\app\PCSF00012 avait
# perdu son eboot.bin et son param.sfo, son titre était retombé sur son
# identifiant, et Vita3K refusait de la démarrer (« Failed to read module
# file app0:eboot.bin »). Un lancement qui détruit ce qu'il devait lancer.
#
# La commande qui LANCE, et ne réinstalle rien, est « -r <identifiant de
# titre> » (« --installed-path : Path to the installed app to run »). Elle ne
# prend pas un chemin : elle prend le NOM du dossier sous ux0\app\, d'où le
# jeton {rom_id} du gabarit ci-dessous, et d'où la convention que la
# bibliothèque doit suivre — un dossier par application, nommé par son
# identifiant de titre, exactement comme Vita3K les range lui-même.
#
# ET UN .VPK N'EST PAS UN JEU : c'est un paquet d'INSTALLATION. Le déclarer
# ferait une entrée Steam qui lance un installateur — un raccourci
# d'apparence parfaitement normale qui ne joue rien, et qui, sur cette
# machine, écrase une application qui marchait. C'est mot pour mot le
# raisonnement déjà écrit pour le .pkg de la PS4.
extensions = []
# eboot.bin est l'exécutable qu'une application Vita porte à sa racine. C'est
# LUI qui distingue une application d'un dossier de sauvegardes — sans
# marqueur, « savedata » deviendrait une entrée de la bibliothèque. À
# CONFIRMER sur une bibliothèque réelle : personne ici n'en a encore vu une.
app_dir_marker = "eboot.bin"
# ⚠ LA FORME LONGUE EST OBLIGATOIRE ICI, et c'est un piège que seul le relevé
# sur le binaire révèle : la forme courte du plein écran est « -F » MAJUSCULE.
# « -f » minuscule est « --load-config », qui charge un fichier de
# configuration. Abréger `--fullscreen` en `-f` par réflexe — c'est la forme
# courte du plein écran chez Cemu et chez RetroArch, deux profils voisins —
# chargerait donc une configuration au lieu de passer en plein écran, et se
# comporterait exactement comme un drapeau ignoré : le jeu s'ouvrirait en
# fenêtre, sans un mot. C'est la même classe d'erreur que les valeurs de
# CropMode recopiées des libellés dans duckstation.toml.
# ⚠ `--keep-config` N'EST PAS DÉCORATIF, et il est la moitié du bloc
# d'amorçage ci-dessus. `overwrite_config` vaut VRAI par défaut —
# add_flag("!--keep-config,!-w", …) dans config/src/config.cpp — et
# `init_config` finit par `serialize_config`. Sans ce drapeau, Vita3K RÉGÉNÈRE
# son config.yml à chaque lancement : l'en-tête que la console vient de poser
# disparaît, la fusion le repose au lancement suivant, et chaque partie dépose
# une sauvegarde de plus — l'inverse exact de ce que l'idempotence garantit.
# La forme longue, pour la même raison que --fullscreen : « -w » se lit mal.
# « -r » ET NON UN CHEMIN. Voir le bloc `extensions` ci-dessus : le
# positionnel de Vita3K signifie « installer ET lancer », et il a détruit une
# application installée. « -r » la LANCE, et ne réinstalle rien.
#
# {rom_id} rend le NOM du dossier inventorié, sans chemin ni extension. Il
# vaut donc l'identifiant de titre — à condition que la bibliothèque nomme ses
# dossiers comme ux0\app\ le fait. C'est la convention, et elle n'est pas
# arbitraire : c'est celle de la console d'origine.
launch     = '--keep-config --fullscreen -r "{rom_id}"'
# Le titre affiché sera le NOM DU DOSSIER. Si le propriétaire garde les
# identifiants de titre de la console (« PCSE00123 »), sa bibliothèque Steam
# affichera des identifiants. Le vrai nom du jeu est dans
# sce_sys\param.sfo, à l'intérieur du dossier ; le lire est un travail à part,
# non fait, et c'est la limite connue de ce profil.
#
# BIOS : rien à déclarer, et ce n'est PAS que Vita3K se passe de firmware.
#
# Il en exige un, et sans lui les symptômes sont ceux de DuckStation sans
# BIOS — le jeu apparaît, se lance, écran noir. Mais le mécanisme `bios` de ce
# projet vérifie des FICHIERS DÉPOSÉS dans un dossier partagé, à leur
# empreinte MD5, et pointe l'émulateur dessus ; le firmware Vita n'est pas de
# cette nature. C'est un PUP qui s'INSTALLE une fois dans l'arborescence de
# l'émulateur, exactement comme le PS3UPDAT.PUP de RPCS3, et son empreinte
# change à chaque version de firmware sans que rien de publiquement citable
# n'existe. Il n'y a donc rien de vérifiable à déclarer ici : ce profil ne
# couvre pas le firmware, et le dit.
#
# Le patron, lui, se lit sur le PARTAGE (2026-08-29) : G:\retro\bios\ ne
# contient que des BIOS-fichiers, sur lesquels l'émulateur est POINTÉ par sa
# configuration — duckstation.toml le documente déjà pour
# [BIOS] SearchDirectory. Un FIRMWARE, lui, est rangé à côté, hors de bios\,
# précisément parce qu'il ne se lit pas : il s'installe. Le PUP Vita suivra
# ce rangement-là, pas celui de bios\.
#
# Ce que Vita3K a de plus que RPCS3, et qui rend la suite faisable sans
# souris : « --firmware <chemin.pup> » installe le firmware depuis la ligne de
# commande. CE N'EST PLUS UNE PROMESSE — c'est fait, mesuré le 2026-08-29 :
#
#   Installing firmware file G:\retro\bios\PSVUPDAT.PUP
#   extract_pup_files: PUP Version: 0x2
#   extract_pup_files: Firmware Version: 0x3740000        (soit la 3.74)
#   Firmware installation progress: 10% … 100%
#
# Le PUP vient du serveur de Sony, dont l'URL est publiée par la page de
# support PlayStation elle-même — c'est une distribution officielle, au même
# titre que le PS3UPDAT.PUP de RPCS3, et rien n'a été pris ailleurs.
#
# CE QUI RESTE OUVERT, et qui empêche encore d'en faire un amorçage
# automatique : le PUP a été déposé dans G:\retro\bios\ alors que le
# raisonnement ci-dessus rangeait les firmwares HORS de bios\. Le rangement
# n'est donc pas tranché, il est seulement constaté. Et rien ne sait encore
# CONSTATER qu'un firmware est déjà installé — le réinstaller à chaque
# lancement coûterait sept secondes par jeu.
#
# NON MESURÉ, et à surveiller au premier jeu : Vita3K distingue le firmware
# principal du PAQUET DE POLICES, et écrit lui-même qu'il ne publie pas l'URL
# de ce dernier. Il n'a donc PAS été installé. Si du texte manque en jeu,
# c'est là qu'il faut regarder — le symptôme serait du texte absent, pas un
# refus de démarrer.
bios       = []

# Modes de rendu : aucun bloc, et c'est une réponse, pas un oubli. Des options
# lues dans config.cpp, aucune n'est un réglage de rendu : --backend-renderer
# choisit OpenGL ou Vulkan, ce qui n'est ni une résolution ni un cadrage. Le
# multiplicateur de résolution de Vita3K vit dans son config.yml, que le second
# bloc d'amorçage sait désormais atteindre — mais sa CLÉ n'a pas été relevée,
# et une clé inventée serait ignorée en silence.
# `cost` n'est pas déclaré non plus : il ne sert qu'au mode `auto`, qui croise
# ce coût avec la machine POUR CHOISIR ENTRE des modes déclarés. Sans modes,
# ce serait une valeur que personne ne lit.

# DETTE D4 — le mouvement, qui n'est pas traité ici et ne peut pas l'être.
#
# Une part notable du catalogue Vita se sert du gyroscope. La console n'en
# transmet aucune donnée : Apollo annonce un Xbox 360, qui n'a ni gyroscope ni
# tactile. C'est la dette D4, elle-même bloquée derrière D3, et elle se règle
# côté invité — pas dans ce fichier.
#
# CORRECTION DU 2026-08-29 — CE BLOC ANNONÇAIT UNE PROTECTION QUI N'EXISTE
# PAS. Il présentait la substitution de l'identifiant SDL au lancement, par
# retro/launcher.py, comme un mécanisme en place. Vérifié dans le code :
# aucune substitution d'identifiant n'a jamais été écrite. Les seuls jetons
# substitués dans tout le dépôt sont {render_config} (retro/launcher.py) et
# {render}, {rom}, {width}, {height}, {scale} (retro-launch.cs) — tous de
# rendu. Il n'y a ni {pad1}, ni GUID, ni index substitué nulle part. Les
# tâches 2 à 4 du plan des manettes, celles qui devaient créer ce mécanisme,
# n'ont pas été exécutées : elles restent entières.
#
# Pourquoi cette erreur-là comptait plus qu'une autre : elle décrivait une
# GARANTIE. Le prochain lecteur écrit un gabarit d'entrée en supposant que la
# substitution le protégera du changement de type de pad, la console devient
# muette, et rien ne le lui dit — une liaison qui ne correspond à aucun
# périphérique est ignorée en silence.
#
# ET IL N'Y A DE TOUTE FAÇON AUCUNE CLÉ DE MOUVEMENT À ÉCRIRE ICI. Relevé le
# 2026-08-29 dans la source de Vita3K : vita3k/config/include/config/config.h
# porte `code(bool, "disable-motion", false, disable_motion)` — le défaut est
# déjà « mouvement actif ». Le mouvement dépend entièrement de ce que SDL
# rapporte du pad, et de rien d'autre : vita3k/ctrl/src/ctrl.cpp interroge
# SDL_GamepadHasSensor pour le gyroscope puis pour l'accéléromètre, et conclut
# `has_motion_support = found_gyro && found_accel`. LES DEUX capteurs sont
# exigés. Cette lecture est faite sur la branche amont, PAS sur la révision
# épinglée au manifeste : à re-vérifier avant de s'en servir.
#
# Ce qui reste à faire ICI le jour où D4 sera levée : rien à écrire, tout à
# mesurer — voir si le pad qu'Apollo annonce expose ses deux capteurs à SDL.
#
# La PS Vita a aussi un écran tactile avant et un pavé tactile arrière, dont
# aucune manette ne dispose. C'est un manque de plus, distinct du gyroscope,
# et il n'est traité nulle part.
