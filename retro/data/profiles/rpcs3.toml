# RPCS3 — PlayStation 3.
#
# L'archive épinglée au manifeste a été listée : 274 entrées, aucun dossier
# racine, rpcs3.exe à la racine. `exe` est donc un nom plat.
#
# Les deux options sont lues DANS l'exécutable livré, celui dont le manifeste
# porte l'empreinte :
#   --no-gui     « Run RPCS3 without its GUI » ;
#   --fullscreen « Run games in fullscreen mode. Only used when no-gui is
#                set. » — d'où l'ordre : --fullscreen SEUL serait ignoré, et le
#                jeu s'ouvrirait en fenêtre sans que rien ne le signale.
# Le même exécutable porte « Cannot run no-gui mode without boot target » :
# --no-gui exige donc un jeu, ce que {rom} garantit.
#
# Les extensions viennent du filtre « Boot (S)ELF » du même exécutable, qui
# accepte *.iso depuis que RPCS3 sait démarrer une image de disque
# (« Booting from BootISO... », « Boot ISO »). Sans cela ce profil n'aurait
# aucun sens ici : le scan n'inventorie que des FICHIERS d'un dossier, jamais
# les arborescences de jeux dumpés que RPCS3 attendait autrefois.

schema = 1
id  = "rpcs3"
exe = 'rpcs3.exe'

# AMORÇAGE — PREMIÈRE CIBLE : les huit modales du dossier de dialogue.
#
# RPCS3 ouvre huit boîtes de dialogue qu'aucune manette ne ferme. Sur une
# console sans clavier, une modale ne se distingue pas d'un jeu qui ne démarre
# pas : `confirmationBoxBootGame` s'interpose à CHAQUE lancement de jeu, et
# `infoBoxEnabledInstallPUP` est ce qui laissait RPCS3 ouvert après
# l'installation du firmware, l'écran figé sur une fenêtre de succès.
#
# LA LISTE VIENT DE LA SOURCE, pas d'une phrase. Elle est relevée dans
# rpcs3/rpcs3qt/gui_settings.h, où chaque modale est un `gui_save` du groupe
# `main_window` — le nom de section est celui de la constante
# `const QString main_window = "main_window";`, celui que QSettings écrit entre
# crochets, et non le libellé de la fenêtre. Ce sont TOUTES les clés du groupe
# dont le défaut est `true` : `infoBoxSkipVersion` est une chaîne et non un
# booléen, `recentGamesFrozen` et `titleBarsVisible` sont déjà faux. Imposer
# `false` sur une clé déjà fausse serait du bruit qui se lit comme un réglage.
# La liste est gelée dans tests/test_donnees.py (RPCS3_MODALES) : l'allonger
# ou la raccourcir est un acte qui se voit en revue.
#
# LA FORME DE LA VALEUR est celle que QSettings écrit pour un booléen faux —
# `false`, en minuscules, sans guillemets — et c'est le même mécanisme Qt qui a
# été VÉRIFIÉ PAR L'EFFET le 2026-08-29 sur Vita3K (`warnAdminPrivileges=false`,
# la modale a disparu). Ce qui reste à faire sur la machine, et que ce profil
# ne peut pas faire à sa place : rouvrir un CurrentSettings.ini que RPCS3 a
# lui-même écrit après avoir décoché les cases, et confirmer la forme de là.
#
# IMPOSÉ, et pas « posé une fois » : chaque case se recoche d'un clic dans
# l'interface, et sur une console déjà jouée le fichier existe — le régime
# « si-absent » passerait son chemin sans un mot.
[[bootstrap]]
# Le jeton {install_dir} est substitué à l'écriture du plan (retro/launcher.py,
# resoudre_cible). Écrire « RPCS3 » en clair ici réécrirait une seconde fois un
# nom que le manifeste décide, et qu'une surcharge du manifeste du propriétaire
# peut changer : la cible raterait EN SILENCE.
target = '{install_dir}\GuiConfigs\CurrentSettings.ini'

# L'en-tête distingue les TROIS catégories, et ce n'est pas une formule : le
# propriétaire CROIT ce qu'il lit en tête d'un fichier de configuration et
# règle son comportement dessus.
#
# Rien d'autre que l'en-tête : aucune préférence de RPCS3 n'a été mesurée, et
# en inventer une la rendrait indiscernable d'un relevé.
content = '''
; Écrit par « retro », qui distingue trois choses :
;   · ce qu'il IMPOSE et repose à CHAQUE lancement — les huit modales
;     ci-dessous, ET la langue de l'interface ; les recocher ou la changer
;     dans l'interface de RPCS3 ne tiendrait pas ;
;   · ce qu'il a posé UNE FOIS, à la création de ce fichier, et ne retouche
;     plus jamais : vos réglages tiennent ;
;   · tout le reste, qui est à vous et qu'il ne lit même pas.
'''

# Huit clés, dans l'ordre de leur déclaration dans gui_settings.h — une liste
# gelée se relit contre sa source.
enforced = '''
[main_window]
infoBoxEnabledInstallPKG=false
infoBoxEnabledInstallPUP=false
infoBoxEnabledWelcome=false
confirmationBoxExitGame=false
confirmationBoxBootGame=false
confirmationObsoleteCfg=false
confirmationSameButtons=false
confirmationRestart=false
'''

# LA LANGUE DE L'INTERFACE DE RPCS3.
#
# RELEVÉE le 2026-09-04, en DEUX temps parce qu'une seule source ne suffisait
# pas — et c'est ce qui distingue cette table d'une recopie.
#
# LA CLÉ vient de la source, à la révision que le manifeste épingle — la
# construction 0.0.42-19843, dont l'URL nomme le commit —,
# rpcs3/rpcs3qt/gui_settings.h :
#
#     const gui_save loc_language = gui_save(localization, "language", "en");
#
# ⚠ LE NOM DE SECTION EST LA VALEUR DE LA CONSTANTE, PAS SON NOM. Le même
# fichier écrit `const QString localization = "Localization";` — avec sa
# majuscule — là où `main_window` vaut « main_window » en minuscules. Les huit
# modales ci-dessus sont donc sous `[main_window]` et la langue sous
# `[Localization]`, dans le MÊME fichier. Déduire l'un de l'autre donnerait une
# section que QSettings n'ouvrirait jamais, et la clé ne serait pas lue.
#
# LES VALEURS NE SONT PAS DANS LA SOURCE, et c'est le fait qui a exigé le
# second temps. `gui_application::GetAvailableLanguageCodes()` ne porte AUCUNE
# liste : il ÉNUMÈRE `rpcs3_*.qm` dans le dossier de traductions de Qt et
# taille le code entre le premier « _ » et le point. La liste des valeurs
# acceptées est donc une propriété de L'ARCHIVE INSTALLÉE, pas du code.
#
# ELLES SONT DONC RELEVÉES SUR L'ARCHIVE ÉPINGLÉE ELLE-MÊME — téléchargée le
# 2026-09-04 et comparée à l'empreinte que le manifeste porte pour elle, qui
# n'est pas recopiée ici : deux exemplaires d'une empreinte, c'est un
# exemplaire de trop à mettre à jour. Douze fichiers
# `qt6/translations/rpcs3_*.qm`, soit
#     ca_ES  de_DE  es_ES  fi_FI  fr_FR  hr_HR  it_IT
#     pl_PL  pt_BR  pt_PT  sv_SE  zh_CN
# Deux d'entre eux — `ca_ES` (catalan) et `hr_HR` (croate) — ne correspondent à
# aucune langue de Steam et ne sont donc pas déclarés ici.
#
# ⚠ « en » N'EST PAS DANS CETTE LISTE, ET C'EST NORMAL. Aucun `rpcs3_en*.qm`
# n'est livré : l'anglais est la langue des chaînes du binaire. La valeur
# `en` est celle du défaut de `loc_language` ci-dessus, et celle que
# `gui_application.cpp` pose lui-même quand le code configuré ne figure pas
# parmi les fichiers trouvés — `QLocale(QLocale::English).bcp47Name()`.
#
# ⚠ ET C'EST LA FRAGILITÉ DE CETTE TABLE, écrite ici parce qu'elle ne se
# verrait nulle part ailleurs : un code absent de l'archive ne produit AUCUNE
# erreur. RPCS3 retombe sur l'anglais ET RÉÉCRIT `language=en` dans ce fichier
# (`SetValue(gui::loc_language, m_language_code)`). Comme la console repose la
# table à chaque lancement, la console et l'émulateur se contrediraient en
# boucle, sans un mot : le fichier dirait `fr_FR`, l'interface serait en
# anglais. Le jour où RPCS3 monte de version, cette table se re-relève sur la
# NOUVELLE archive — la liste des `.qm` livrés n'est promise par personne.
#
# LES LANGUES DE STEAM ABSENTES DE L'ARCHIVE — arabe, bulgare, chinois
# traditionnel, tchèque, danois, grec, hongrois, indonésien, japonais, coréen,
# malais, norvégien, néerlandais, roumain, russe, espagnol d'Amérique latine,
# thaï, turc, ukrainien, vietnamien — ne sont pas déclarées : elles prennent le
# repli, et « retro status » les nomme une par une.
#
# THIS BLOCK ONLY POSES THE INTERFACE. The emulated PS3's SYSTEM language —
# the one a game asks for — is `System: Language:` in RPCS3's config.yml,
# posed by the third bootstrap of this profile since the YAML dialect reads
# two levels (2026-09-26).
[bootstrap.langue]
repli = "english"
english    = "[Localization]\nlanguage=en"
german     = "[Localization]\nlanguage=de_DE"
spanish    = "[Localization]\nlanguage=es_ES"
finnish    = "[Localization]\nlanguage=fi_FI"
french     = "[Localization]\nlanguage=fr_FR"
italian    = "[Localization]\nlanguage=it_IT"
polish     = "[Localization]\nlanguage=pl_PL"
brazilian  = "[Localization]\nlanguage=pt_BR"
portuguese = "[Localization]\nlanguage=pt_PT"
swedish    = "[Localization]\nlanguage=sv_SE"
schinese   = "[Localization]\nlanguage=zh_CN"

# AMORÇAGE — SECONDE CIBLE : la manette, et la cause n'était pas une mauvaise
# liaison. C'était l'ABSENCE TOTALE de gestionnaire.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « dédiée », dont la cible SUPPOSÉE pour
# RPCS3 est config\input_configs\ — hypothèse du plan des manettes, jamais
# mesurée. Le nom de la clé, lui, n'a été relevé dans AUCUN fichier que RPCS3
# a lui-même écrit ; recopié d'une documentation, il serait ignoré en silence
# et la manette resterait muette exactement comme aujourd'hui. Ce qui reste à
# relever, sur la machine : ce que RPCS3 écrit de lui-même une fois la
# vibration activée dans son interface — même méthode que pour l'identifiant
# de manette (tâche 1 du sous-projet E), et pour la même raison.
#
# Constaté le 2026-08-29 sur LittleBigPlanet (BCES-00611) : le jeu tournait à 30 fps en
# Vulkan et aucun bouton ne répondait. La cause est dans Emu/Io/pad_config.h :
#
#     cfg_player player1{ this, "Player 1 Input", pad_handler::null };
#
# `pad_handler::null` est le DÉFAUT. Sans le fichier
# config\input_configs\global\Default.yml — qui n'existait pas, non plus que
# son dossier — le joueur 1 n'a aucun gestionnaire. Pas une mappe fausse : pas
# de manette du tout.
#
# THREE LINES PER PLAYER ARE ENOUGH, where DuckStation needed twenty-seven
# bindings: xinput_pad_handler::init_config() fills the twenty-four `.def`
# then calls from_default(), so RPCS3 builds the whole map itself once the
# handler is chosen. The owner confirmed that player 1's controls respond.
#
# FOUR PLAYERS, added on 2026-09-26, and four only. Read in the source at the
# revision the manifest pins (6567a5a2):
#   - Emu/Io/pad_config.h declares seven `cfg_player`, "Player 1 Input" to
#     "Player 7 Input", all defaulting to `pad_handler::null` — a player
#     missing from this file has NO controller at all, exactly player 1's
#     failure before this file existed;
#   - xinput_pad_handler.cpp sets `m_max_devices = XUSER_MAX_COUNT` (four)
#     and names each pad `m_name_string + std::to_string(i + 1)`: "XInput
#     Pad #1" to "#4", the XInput user index plus one. A fifth player would
#     have no device to name.
# The order holds for the same reason as Dolphin's: Apollo pins four
# identical Xbox 360 pads (the "installer" repository), and the XInput index
# depends on no device name. Players 2 to 4 are POSED, never SEEN
# responding — see `mapping_where` below.
#
# ⚠ DEUX PIÈGES DE FORME, et chacun aurait donné un réglage d'apparence posé
# qui ne fait rien :
#   - la valeur est « XInput », avec ses deux majuscules. Relevée dans
#     pad_config_types.cpp : `case pad_handler::xinput: return "XInput";`.
#   - « Device » DOIT être cité : en YAML, « # » ouvre un commentaire, donc
#     `XInput Pad #1` non quoté devient `XInput Pad`, qui ne désigne rien. Le
#     nom vient de xinput_pad_handler.cpp, `m_name_string = "XInput Pad #"`.
#
# POSÉ EN BLOC, « si-absent », et JAMAIS imposé — trois raisons, et la
# troisième est une autorisation qui manque :
#   - « si-absent » COPIE DES OCTETS et ne lit jamais le contenu : le lanceur
#     n'a pas à apprendre le YAML, et la fusion continue de ne parler qu'INI ;
#   - la cible vit sous le dossier d'installation, que « retro install » efface
#     à chaque montée de version : la cible disparaît, donc « si-absent »
#     repose. C'est l'auto-réparation que la conception prévoyait ;
#   - reposer ce fichier À CHAQUE lancement serait ÉCRASER, pas fusionner.
#     RPCS3 réécrit lui-même ce fichier quand on configure un pad dans son
#     interface : un remplacement intégral effacerait sans un mot toute
#     liaison faite là. Le propriétaire a autorisé « seulement les clés que la
#     console doit imposer » dans un INI qu'on fusionne, pas cela.
#
# ⚠ CE QUE « si-absent » NE RÉPARE PAS : si le fichier existe avec
# `Handler: Null` — ce que produit un passage malheureux par la configuration
# de pad de RPCS3 —, il n'est PAS remplacé. Le remède est le geste de sortie
# ci-dessous, ou une montée de version de RPCS3, qui efface le dossier.
#
# ⚠ `Handler: XInput` EST UN ARBITRAGE, DATÉ ET RÉVERSIBLE — PAS UN FAIT
# MESURÉ SUR L'ÉMULATEUR, et c'est la seule ligne de ce fichier dont ce soit
# le cas. Rendu le 2026-08-29 par la conduite de projet, entre D7 qui
# prescrivait XInput (vu fonctionner) et D4 qui a relevé dans la source que
# `b_has_motion` reste faux sous XInput, quel que soit le pad — donc que ce
# choix interdit le mouvement pour toujours. XInput l'emporte parce qu'il est
# la seule des deux valeurs qu'on ait VUE fonctionner, parce que
# xinput_pad_handler.cpp pose `b_has_rumble = true` (il ne coûte donc pas la
# vibration, seulement le mouvement), et parce que basculer sans mesure
# reviendrait à déboguer deux inconnues à la fois. `Handler: SDL` n'a JAMAIS
# été essayé sur cette machine.
#
# ⚠ LE GESTE DE SORTIE, et il n'est pas facultatif. « si-absent » ne réécrit
# jamais : le jour où D4 aura mesuré `Handler: SDL` — un bouton VU répondre,
# rien de moins —, changer la valeur ci-dessous ne suffira PAS. Le fichier
# existera déjà et rien ne le remplacera ; la bascule échouerait en silence.
# Il faut, sur la console, dans cet ordre :
#
#   1. supprimer <dossier d'installation de RPCS3>\config\input_configs\
#      global\Default.yml — c'est LE geste, et il n'y en a pas d'autre
#      aujourd'hui : aucune option de « retro » ne force le régime
#      « si-absent » à réécrire, et en ajouter une serait une autorisation
#      d'ÉCRASER que le propriétaire n'a pas donnée ;
#   2. lancer un jeu PS3 : le lanceur repose le fichier avec la valeur neuve ;
#   3. voir un bouton répondre — sans quoi rien n'est prouvé.
#
# Une montée de version de RPCS3 fait le premier pas toute seule, puisqu'elle
# efface le dossier d'installation, mais elle ne se commande pas : le geste
# reste la suppression.
[[bootstrap]]
target = '{install_dir}\config\input_configs\global\Default.yml'

# La marque est en commentaire YAML — « # » —, et pas en « ; » : un fichier de
# configuration écrit par un outil doit dire qui l'a écrit DANS la syntaxe de
# son propre format, sinon l'émulateur refuse de le lire et personne ne sait
# pourquoi. C'est ce qui rend la garde de `_lire_bootstrap` vraie pour un
# format qu'elle ne connaît pas.
#
# Rien n'est imposé ici — `enforced` est vide — donc l'en-tête n'a pas trois
# catégories à distinguer : il n'y en a qu'une, et elle est dite.
content = '''
# Écrit par « retro ». Posé UNE FOIS, à la création de ce fichier, et jamais
# retouché : les liaisons que vous ferez dans l'interface de RPCS3 tiennent.
# Rien ici n'est imposé ni reposé au lancement.
Player 1 Input:
  Handler: XInput
  Device: "XInput Pad #1"
Player 2 Input:
  Handler: XInput
  Device: "XInput Pad #2"
Player 3 Input:
  Handler: XInput
  Device: "XInput Pad #3"
Player 4 Input:
  Handler: XInput
  Device: "XInput Pad #4"
'''

# LA LANGUE : aucune ici, et c'est mesuré.
#
# RELEVÉ le 2026-09-04 sur la révision que le manifeste épingle (la
# construction 0.0.42-19843) : ce fichier est lu par
# `cfg_player` (Emu/Io/pad_config.h), qui ne porte QUE des liaisons de
# manette. Les deux langues de RPCS3 vivent ailleurs — celle de son interface
# dans GuiConfigs\CurrentSettings.ini (première cible de ce profil), celle de
# la PS3 émulée dans son config.yml (troisième cible).
langue_absente = """ce fichier ne porte que le gestionnaire de manette \
(cfg_player, Emu/Io/pad_config.h) ; la langue de l'interface vit dans \
GuiConfigs\\CurrentSettings.ini et celle de la PS3 émulée dans config.yml"""

# THIRD TARGET — config.yml, the emulated PS3's system language. Added on
# 2026-09-26, once the YAML dialect learned a second level (retro/dialectes.py
# and retro-yaml.cs, one rule on both sides).
#
# Read at the pinned revision 6567a5a2: Emu/system_config.h declares
# `node_sys` as "System" holding `cfg::_enum<CellSysutilLang> language` named
# "Language", default English (US); the twenty strings are
# fmt_class_string<CellSysutilLang>::format in
# Emu/Cell/Modules/cellSysutil.cpp. Games read it through
# cellSysutilGetSystemParamInt. An unknown string is logged and the previous
# value KEPT (Utilities/Config.cpp, try_to_enum_value) — so a typo here is a
# game in English with one line in RPCS3.log, nothing on screen.
#
# `content` is a header only, in YAML comment syntax ("#", never ";"): RPCS3
# writes this file itself at first launch, so "si-absent" only matters after
# an upgrade has wiped the install folder — then the merge poses "System:"
# alone and RPCS3 fills every other default on its next save, dropping the
# header with it.
#
# ⚠ A per-game configuration (<game>.yml, or config\custom_configs\
# config_<SERIAL>.yml, Emu/System.cpp) is applied AFTER this file, and those
# written from RPCS3's UI are full copies: they override the language. None
# exists on the console (checked 2026-09-26).
#
# The Steam languages the PS3 does not know — Arabic, Bulgarian, Czech, Greek,
# Hungarian, Indonesian, Malay, Romanian, Thai, Ukrainian, Vietnamese — take
# the fallback, and `retro status` names them.
[[bootstrap]]
target = '{install_dir}\config\config.yml'
content = '''
# Écrit par « retro ». Ce fichier porte TROIS sortes de réglages : ce que la
# console IMPOSE et repose à chaque lancement (la langue de la PS3, sous
# « System »), ce qu'elle a posé UNE FOIS et ne retouche plus — rien d'autre
# —, et tout le reste, qui vous appartient : RPCS3 le réécrit lui-même.
'''

[bootstrap.langue]
repli = "english"
japanese   = "System:\n  Language: Japanese"
english    = "System:\n  Language: English (US)"
french     = "System:\n  Language: French"
spanish    = "System:\n  Language: Spanish"
latam      = "System:\n  Language: Spanish"
german     = "System:\n  Language: German"
italian    = "System:\n  Language: Italian"
dutch      = "System:\n  Language: Dutch"
portuguese = "System:\n  Language: Portuguese (Portugal)"
brazilian  = "System:\n  Language: Portuguese (Brazil)"
russian    = "System:\n  Language: Russian"
koreana    = "System:\n  Language: Korean"
tchinese   = "System:\n  Language: Chinese (Traditional)"
schinese   = "System:\n  Language: Chinese (Simplified)"
finnish    = "System:\n  Language: Finnish"
swedish    = "System:\n  Language: Swedish"
danish     = "System:\n  Language: Danish"
norwegian  = "System:\n  Language: Norwegian"
polish     = "System:\n  Language: Polish"
turkish    = "System:\n  Language: Turkish"

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « releve » depuis le 2026-08-29, et il ne peut valoir rien d'autre. Le
# relevé est fait — le gestionnaire est choisi dans le fichier posé par le
# second bloc ci-dessus — et le propriétaire a confirmé que les contrôles
# répondent. « auto » serait FAUX : sans ce fichier, RPCS3 ne trouve rien du
# tout, c'est `pad_handler::null`. « a-relever » ferait annoncer à
# `retro status` une manette muette sur un émulateur dont un bouton a été VU
# répondre, et « inconnu » effacerait la mesure.
#
# ⚠ "releve" HOLDS FOR PLAYER 1 ONLY. Players 2 to 4 (2026-09-26) would be
# "pose"; the field carries one value per profile, and downgrading the whole
# profile would erase the only measurement there is. The reservation is
# therefore written in `mapping_where`, which `retro status` prints verbatim.
# Once a multiplayer game has been seen, drop the reservation; if one player
# does not respond, that player's block is the suspect.
#
# Vibration : aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « dédiée ». Le dossier, lui, n'est plus
# une hypothèse depuis le 2026-08-29 : c'est config\input_configs\global\, et
# le second bloc ci-dessus y pose déjà un fichier. Ce que XInput coûte est
# borné et connu — xinput_pad_handler.cpp pose `b_has_rumble = true`, donc le
# gestionnaire choisi ne bloque PAS la vibration ; il ne coûte que le
# mouvement. Le nom de la clé, lui, n'a été relevé dans AUCUN fichier que RPCS3
# a lui-même écrit ; recopié d'une documentation, il serait ignoré en silence
# et la manette resterait muette exactement comme aujourd'hui. Ce qui reste à
# relever, sur la machine : ce que RPCS3 écrit de lui-même une fois la
# vibration activée dans son interface — même méthode que pour l'identifiant
# de manette (tâche 1 du sous-projet E), et pour la même raison.
[input]
steam_input = "required"
mode        = "xinput"
mapping       = "releve"
mapping_where = 'config\input_configs\global\Default.yml, sous le dossier d installation de RPCS3, sections « Player 1 Input » à « Player 4 Input » — posé par le second bloc [[bootstrap]] de ce profil ; seul le joueur 1 a été VU répondre, les joueurs 2 à 4 sont posés et jamais essayés'
rumble        = "inconnu"

# SOUS QUEL PAD ce releve a ete fait. Mesure le 2026-08-29 : Apollo annonce
# un Xbox 360, et l'invite porte 045e:028e.
#
# ⚠ ET C'EST LE PREMIER QUI MOURRA A LA BASCULE. Le jour ou Apollo annoncera
# une DualShock, les deux lignes posees plus haut cesseront de designer quoi
# que ce soit :
#   - « Handler: XInput » depend du GESTIONNAIRE, pas d'un index. Contrairement
#     aux vingt-sept « SDL-0 » de DuckStation, qui survivent parce qu'un index
#     ne depend d'aucun VID/PID, celui-ci ne survit pas ;
#   - « Device » nomme le peripherique tel que ce gestionnaire-la le nomme —
#     le nom vient de m_name_string dans xinput_pad_handler.cpp. Un autre
#     gestionnaire, un autre nom.
#
# ET LA PANNE SERA SILENCIEUSE, deux fois plutot qu'une : RPCS3 ne dira pas
# qu'un peripherique nomme est absent, et le fichier qui porte ces lignes a ete
# pose A LA MAIN sur la console (D7). Il n'est dans aucun fichier versionne,
# donc dans le champ d'AUCUNE garde de ce depot — la garde anti-GUID des
# profils ne peut rien pour lui. Ces lignes de commentaire sont tout ce qui
# reliera la panne a sa cause le jour venu.
pad_releve    = "x360"

[exit]
# L'exécutable livré porte « Open Home Menu », « PS Button », « Exit Game? » et
# « Stop/Exit Game » : le menu maison s'ouvre au bouton PS et offre l'arrêt du
# jeu. Rien n'y est déclaré pour autant, parce que RPCS3 ne livre aucune
# configuration de manette par défaut dans son archive — la liaison du bouton
# PS est à faire dans ses réglages, et l'annoncer avant serait une promesse
# que la console ne tiendrait pas.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "ps3"
name       = "PlayStation 3"
folders    = ["PS3"]
# .self et .elf sont les exécutables homebrew que RPCS3 démarre directement.
# .bin est écarté : un jeu dumpé s'appelle EBOOT.BIN, donc tous porteraient le
# même titre dans Steam et un seul survivrait.
extensions = [".iso", ".self", ".elf"]
launch     = '--no-gui --fullscreen {render} "{rom}"'
# RPCS3 exige le firmware PS3, qui n'est pas un fichier déposé dans un dossier
# de BIOS mais une mise à jour (PS3UPDAT.PUP) INSTALLÉE une fois depuis
# l'interface. Son empreinte change à chaque version de firmware et n'a rien de
# publiquement citable : rien de vérifiable à déclarer ici.
bios       = []

# --- LE RENDU (dette D2) : LE TROISIÈME AXE EST ABSENT, ET C'EST MESURÉ ---
#
# Ce bloc ne pilote RIEN, et c'est très exactement ce qu'il dit. Il
# existe pour que `retro status` cesse de compter ce système parmi ceux
# dont personne n'a regardé le remplissage : la question a été posée, et
# la réponse est non. Les deux états ne s'appellent pas le même geste —
# l'un rouvre une enquête, l'autre la clôt.
# PlayStation 3 : « medium » est un ARBITRAGE et non une mesure — personne n'a
# chronométré une partie sur cette machine. Il est ici SANS EFFET OBSERVABLE,
# et c'est ce qui le rend bon marché : les deux modes de ce système passent
# exactement la même chose à l'émulateur — rien —, donc le mode que `auto`
# retient ne change aucune commande. Le champ est exigé dès qu'un bloc de
# rendu existe ; sa valeur ne décidera de quelque chose que le jour où l'un
# des deux modes aura des arguments.
cost       = "medium"
[system.render]
# native_height et max_scale ne sont PAS déclarés : ils ne sont exigés que par
# {scale}, et aucun des deux modes ne l'emploie.
[system.render.native]
args = ""
note = "RPCS3 n'a qu'un levier de rendu en ligne de commande, « --config <yml partiel> », et il ÉCARTE la configuration du propriétaire au lieu de s'y ajouter — relevé le 2026-09-04. S'en servir pour un réglage de rendu lui reprendrait tous les autres, en silence. Sa résolution interne (Video: Resolution Scale, en pourcentage) et son ratio vivent donc dans son config.yml, qu'aucune entrée [[bootstrap]] de ce profil ne vise — les deux qu'il porte visent son INI de modales et son Default.yml de manette."
crt_absent = "RPCS3 n'embarque aucun shader CRT choisissable en ligne de commande. NON VÉRIFIÉ : ce qu'il rend de lui-même."
fill_absent = "RPCS3 à la révision épinglée n'expose AUCUN réglage de mise à l'échelle entière. Relevé le 2026-09-04 dans son arbre source à la révision que le manifeste épingle, et cherché exhaustivement — « integer scal », « pixel.perfect », « integer_scal », « nearest.neigh » : ZÉRO occurrence. Ce qu'il a sur cet axe est un FILTRE, qui retire le flou mais laisse des pixels de tailles inégales, et la lecture de son calcul de rectangle de destination le confirme plutôt que de le supposer : réels flottants, aucun `floor`, aucun `min(w/fbw, h/fbh)`. C'est le pendant exact de ce que Dolphin déclare déjà. PROVENANCE : le relevé de la dette D2 du 2026-09-04, non rejoué ici — aucun arbre source d'émulateur ne vit sur l'hôte. NON VÉRIFIÉ : ce que RPCS3 à la révision épinglée fait de lui-même sur cet axe — personne n'a regardé une partie."
[system.render.full]
args = ""
note = "même raison qu'en mode natif : rien à passer sur la ligne de commande."
fill_absent = "RPCS3 à la révision épinglée n'expose AUCUN réglage de mise à l'échelle entière. Relevé le 2026-09-04 dans son arbre source à la révision que le manifeste épingle, et cherché exhaustivement — « integer scal », « pixel.perfect », « integer_scal », « nearest.neigh » : ZÉRO occurrence. Ce qu'il a sur cet axe est un FILTRE, qui retire le flou mais laisse des pixels de tailles inégales, et la lecture de son calcul de rectangle de destination le confirme plutôt que de le supposer : réels flottants, aucun `floor`, aucun `min(w/fbw, h/fbh)`. C'est le pendant exact de ce que Dolphin déclare déjà. PROVENANCE : le relevé de la dette D2 du 2026-09-04, non rejoué ici — aucun arbre source d'émulateur ne vit sur l'hôte. NON VÉRIFIÉ : ce que RPCS3 à la révision épinglée fait de lui-même sur cet axe — personne n'a regardé une partie."
