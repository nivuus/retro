# PPSSPP — PlayStation Portable.
#
# L'archive épinglée au manifeste a été listée : 194 entrées, aucun dossier
# racine, PPSSPPWindows64.exe à la racine à côté de assets\. `exe` est donc un
# nom plat.
#
# Les trois options viennent de UI/NativeApp.cpp de la révision v1.20.4, celle
# dont le manifeste porte l'empreinte :
#   --fullscreen      force bFullScreen sans l'enregistrer dans la config ;
#   --pause-menu-exit fait QUITTER PPSSPP quand on choisit « Exit » dans le
#                     menu de pause, au lieu de revenir à la liste de jeux ;
#   --escape-exit     ferait la même chose sur Échap — inutile ici, la console
#                     n'a pas de clavier.
#
# La liste d'extensions est lue DANS l'exécutable livré : « iso:cso:chd:pbp:
# elf:prx:ppdmp ». Les trois dernières sont écartées — homebrew et traces —,
# elles n'ont rien à faire dans un dossier de jeux.

schema = 1
id  = "ppsspp"
exe = 'PPSSPPWindows64.exe'

# Amorçage : pas de bloc [bootstrap]. Ce que PPSSPP doit recevoir pour
# lancer un jeu au lieu de son assistant de première configuration reste À
# MESURER sur la machine, et aucune clé n'entre dans un profil sans avoir
# été relevée dans un fichier que l'émulateur a lui-même écrit — une clé
# recopiée d'une documentation est ignorée en silence, et le jeu ne démarre
# toujours pas. Ce bloc absent dit donc « personne n'a encore regardé », pas
# « cet émulateur se débrouille » : voir
# docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"

[exit]
# Le seul des sept à offrir une sortie manette PAR DÉFAUT : dans
# Core/KeyMapDefaults.cpp (v1.20.4), la table XInput lie VIRTKEY_PAUSE à
# NKCODE_HOME — le bouton Guide — et à la gâchette gauche à fond. Le menu de
# pause s'ouvre donc sans clavier, et --pause-menu-exit fait que son « Exit »
# rend la main à Steam au lieu d'afficher la liste de jeux.
native   = "Guide (ou gâchette gauche) puis Exit"
fallback = "alt+f4"

[[system]]
id         = "psp"
name       = "PlayStation Portable"
folders    = ["PSP"]
extensions = [".iso", ".cso", ".chd", ".pbp"]
launch     = '--fullscreen --pause-menu-exit "{rom}"'
# PPSSPP émule le firmware PSP en haut niveau : docs.libretro.com l'écrit noir
# sur blanc, « No BIOS file required to play ». Rien à exiger.
bios       = []
