# PPSSPP — PlayStation Portable.
#
# L'archive épinglée au manifeste a été listée : 194 entrées, aucun dossier
# racine, PPSSPPWindows64.exe à la racine à côté de assets\. `exe` est donc un
# nom plat.
#
# Les trois options viennent de UI/NativeApp.cpp de la révision v1.20.4, celle
# dont le manifeste porte l'empreinte :
#   --fullscreen      force bFullScreen sans l'enregistrer dans la config ;
#   --pause-menu-exit fait QUITTER PPSSPP quand on choisit « Exit » dans le
#                     menu de pause, au lieu de revenir à la liste de jeux ;
#   --escape-exit     ferait la même chose sur Échap — inutile ici, la console
#                     n'a pas de clavier.
#
# La liste d'extensions est lue DANS l'exécutable livré : « iso:cso:chd:pbp:
# elf:prx:ppdmp ». Les trois dernières sont écartées — homebrew et traces —,
# elles n'ont rien à faire dans un dossier de jeux.

schema = 1
id  = "ppsspp"
exe = 'PPSSPPWindows64.exe'

# BOOTSTRAP — the language only, added on 2026-09-26. Nothing else is
# imposed: no first-run wizard has been seen blocking a game here.
#
# THE FILE: <exe>\memstick\PSP\SYSTEM\ppsspp.ini. Windows/main.cpp
# (InitMemstickDirectory) keeps the memory stick next to the executable
# unless an installed.txt sits there, which the pinned zip does not ship —
# and the console's own file was found at exactly that path.
#
# TWO KEYS, read at v1.20.4 (fa50bb1) in Core/Config.cpp:
#   - [General] Language (generalSettings) is the interface, named after the
#     translation files the archive ships in assets\lang — the table below
#     was listed on the pinned install itself. Two codes are not ISO: Czech
#     is cz_CZ and Greek gr_EL, exactly as the files are named;
#   - [SystemParam] GameLanguage (systemParamSettings) is what games read.
#     -1 is "Auto": GetPSPLanguage() derives it from [General] Language
#     through assets\langregion.ini [SystemLanguage] (fr_FR = FRENCH). It
#     is IMPOSED at -1 so that one table drives both; a fixed value would
#     win over the console's language. The old [SystemParam] Language key
#     is no longer read at this version.
# ⚠ GameLanguage is PER_GAME: a <GAMEID>_config.ini still overrides it.
[[bootstrap]]
target = '{install_dir}\memstick\PSP\SYSTEM\ppsspp.ini'
content = """
; Écrit par « retro ». Ce fichier porte TROIS sortes de réglages : ce que la
; console IMPOSE et repose à chaque lancement (la langue), ce qu'elle a posé
; UNE FOIS et ne retouche plus — rien, pour PPSSPP —, et tout le reste, qui
; vous appartient : PPSSPP le réécrit lui-même, et ces commentaires avec.
"""
enforced = """
[SystemParam]
GameLanguage = -1
"""

[bootstrap.langue]
repli = "english"
arabic     = "[General]\nLanguage = ar_AE"
brazilian  = "[General]\nLanguage = pt_BR"
bulgarian  = "[General]\nLanguage = bg_BG"
czech      = "[General]\nLanguage = cz_CZ"
danish     = "[General]\nLanguage = da_DK"
dutch      = "[General]\nLanguage = nl_NL"
english    = "[General]\nLanguage = en_US"
finnish    = "[General]\nLanguage = fi_FI"
french     = "[General]\nLanguage = fr_FR"
german     = "[General]\nLanguage = de_DE"
greek      = "[General]\nLanguage = gr_EL"
hungarian  = "[General]\nLanguage = hu_HU"
indonesian = "[General]\nLanguage = id_ID"
italian    = "[General]\nLanguage = it_IT"
japanese   = "[General]\nLanguage = ja_JP"
koreana    = "[General]\nLanguage = ko_KR"
latam      = "[General]\nLanguage = es_LA"
malay      = "[General]\nLanguage = ms_MY"
norwegian  = "[General]\nLanguage = no_NO"
polish     = "[General]\nLanguage = pl_PL"
portuguese = "[General]\nLanguage = pt_PT"
romanian   = "[General]\nLanguage = ro_RO"
russian    = "[General]\nLanguage = ru_RU"
schinese   = "[General]\nLanguage = zh_CN"
spanish    = "[General]\nLanguage = es_ES"
swedish    = "[General]\nLanguage = sv_SE"
tchinese   = "[General]\nLanguage = zh_TW"
thai       = "[General]\nLanguage = th_TH"
turkish    = "[General]\nLanguage = tr_TR"
ukrainian  = "[General]\nLanguage = uk_UA"
vietnamese = "[General]\nLanguage = vi_VN"

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « dédiée », dont la cible SUPPOSÉE pour
# PPSSPP est controls.ini — hypothèse du plan des manettes, jamais mesurée. Le
# nom de la clé, lui, n'a été relevé dans AUCUN fichier que PPSSPP a lui-même
# écrit ; recopié d'une documentation, il serait ignoré en silence et la
# manette resterait muette exactement comme aujourd'hui. Ce qui reste à
# relever, sur la machine : ce que PPSSPP écrit de lui-même une fois la
# vibration activée dans son interface — même méthode que pour l'identifiant
# de manette (tâche 1 du sous-projet E), et pour la même raison.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# Le seul des sept à offrir une sortie manette PAR DÉFAUT : dans
# Core/KeyMapDefaults.cpp (v1.20.4), la table XInput lie VIRTKEY_PAUSE à
# NKCODE_HOME — le bouton Guide — et à la gâchette gauche à fond. Le menu de
# pause s'ouvre donc sans clavier, et --pause-menu-exit fait que son « Exit »
# rend la main à Steam au lieu d'afficher la liste de jeux.
native   = "Guide (ou gâchette gauche) puis Exit"
fallback = "alt+f4"

[[system]]
id         = "psp"
name       = "PlayStation Portable"
folders    = ["PSP"]
extensions = [".iso", ".cso", ".chd", ".pbp"]
launch     = '--fullscreen --pause-menu-exit "{rom}"'
# PPSSPP émule le firmware PSP en haut niveau : docs.libretro.com l'écrit noir
# sur blanc, « No BIOS file required to play ». Rien à exiger.
bios       = []
