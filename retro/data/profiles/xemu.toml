# xemu — Xbox.
#
# L'archive épinglée au manifeste a été listée : deux entrées, xemu.exe et
# LICENSE.txt, aucune dans un dossier racine. `exe` est donc un nom plat.
#
# Les options sont lues DANS l'exécutable livré, celui dont le manifeste porte
# l'empreinte — xemu hérite l'analyseur de QEMU :
#   -full-screen  « start in full screen » (avec le tiret du milieu : ce n'est
#                 PAS -fullscreen, et l'orthographe voisine passerait pour une
#                 option inconnue) ;
#   -dvd_path     monte l'image dans le lecteur.
# L'image de disque ne se donne pas en argument positionnel : sans -dvd_path,
# xemu démarre sur le tableau de bord Xbox et la console a l'air de marcher.
#
# La liste d'extensions vient du filtre du même exécutable : « Disc Image Files
# (*.iso, *.xiso) ».

schema = 1
id  = "xemu"
exe = 'xemu.exe'

# THE GAMES' LANGUAGE. An Xbox game asks the kernel for it, and the kernel
# reads it from the EEPROM — never from xemu.toml. xemu generates that image
# itself at first start (%APPDATA%\xemu\xemu\eeprom.bin, the default of
# sys.files.eeprom_path, found there on the console) with THIS console's
# serial number and hard-disk key: retro therefore never poses it, it
# changes the language (u32 at 0x90) and the user section's checksum (0x60)
# and nothing else (retro-eeprom.cs, layout of hw/xbox/eeprom_generation.h
# at revision fc24584). XC_LANGUAGE codes from Cxbx-Reloaded,
# src/common/EmuEEPROM.h. The Xbox has a single Chinese, traditional:
# "schinese" is not declared and takes the fallback.
#
# The rest of xemu's start-up — the welcome screen, the BIOS paths — lives
# in the console's xemu.toml, posed outside this profile.
[[bootstrap]]
target = '%APPDATA%\xemu\xemu\eeprom.bin'

[bootstrap.langue]
repli      = "english"
english    = "language = 1"
japanese   = "language = 2"
german     = "language = 3"
french     = "language = 4"
spanish    = "language = 5"
latam      = "language = 5"
italian    = "language = 6"
koreana    = "language = 7"
tchinese   = "language = 8"
portuguese = "language = 9"
brazilian  = "language = 9"

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « générale », dont la cible SUPPOSÉE pour
# Xemu est xemu.toml — hypothèse du plan des manettes, jamais mesurée. Le nom
# de la clé, lui, n'a été relevé dans AUCUN fichier que Xemu a lui-même écrit
# ; recopié d'une documentation, il serait ignoré en silence et la manette
# resterait muette exactement comme aujourd'hui. Ce qui reste à relever, sur
# la machine : ce que Xemu écrit de lui-même une fois la vibration activée
# dans son interface — même méthode que pour l'identifiant de manette (tâche 1
# du sous-projet E), et pour la même raison.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# Rien à déclarer : le menu de xemu est une interface ImGui pilotée à la souris
# et au clavier, et aucune liaison manette par défaut ne l'ouvre — rien dans
# l'exécutable livré n'en atteste. Le fallback Steam Input est la seule sortie.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "xbox"
name       = "Xbox"
folders    = ["Microsoft Xbox", "Xbox Classic", "Xbox Original"]
extensions = [".iso", ".xiso"]
launch     = '-full-screen -dvd_path "{rom}"'
# xemu EXIGE une ROM de démarrage MCPX, un BIOS flash et une image de disque
# dur, tous trois dumpés d'une vraie console. Rien n'est déclaré ici : xemu
# désigne ces trois fichiers par des CHEMINS que le propriétaire choisit dans
# ses réglages, il n'impose aucun nom, et aucune empreinte publiquement
# citable n'a pu être vérifiée pour eux. Déclarer un couple (nom, md5)
# approximatif ferait accuser de corruption un fichier parfaitement valide.
bios       = []
