# xemu — Xbox.
#
# L'archive épinglée au manifeste a été listée : deux entrées, xemu.exe et
# LICENSE.txt, aucune dans un dossier racine. `exe` est donc un nom plat.
#
# Les options sont lues DANS l'exécutable livré, celui dont le manifeste porte
# l'empreinte — xemu hérite l'analyseur de QEMU :
#   -full-screen  « start in full screen » (avec le tiret du milieu : ce n'est
#                 PAS -fullscreen, et l'orthographe voisine passerait pour une
#                 option inconnue) ;
#   -dvd_path     monte l'image dans le lecteur.
# L'image de disque ne se donne pas en argument positionnel : sans -dvd_path,
# xemu démarre sur le tableau de bord Xbox et la console a l'air de marcher.
#
# La liste d'extensions vient du filtre du même exécutable : « Disc Image Files
# (*.iso, *.xiso) ».

schema = 1
id  = "xemu"
exe = 'xemu.exe'

# Amorçage : pas de bloc [bootstrap]. Ce que Xemu doit recevoir pour
# lancer un jeu au lieu de son assistant de première configuration reste À
# MESURER sur la machine, et aucune clé n'entre dans un profil sans avoir
# été relevée dans un fichier que l'émulateur a lui-même écrit — une clé
# recopiée d'une documentation est ignorée en silence, et le jeu ne démarre
# toujours pas. Ce bloc absent dit donc « personne n'a encore regardé », pas
# « cet émulateur se débrouille » : voir
# docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.

[input]
steam_input = "required"
mode        = "xinput"

[exit]
# Rien à déclarer : le menu de xemu est une interface ImGui pilotée à la souris
# et au clavier, et aucune liaison manette par défaut ne l'ouvre — rien dans
# l'exécutable livré n'en atteste. Le fallback Steam Input est la seule sortie.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "xbox"
name       = "Xbox"
folders    = ["Microsoft Xbox", "Xbox Classic", "Xbox Original"]
extensions = [".iso", ".xiso"]
launch     = '-full-screen -dvd_path "{rom}"'
# xemu EXIGE une ROM de démarrage MCPX, un BIOS flash et une image de disque
# dur, tous trois dumpés d'une vraie console. Rien n'est déclaré ici : xemu
# désigne ces trois fichiers par des CHEMINS que le propriétaire choisit dans
# ses réglages, il n'impose aucun nom, et aucune empreinte publiquement
# citable n'a pu être vérifiée pour eux. Déclarer un couple (nom, md5)
# approximatif ferait accuser de corruption un fichier parfaitement valide.
bios       = []
