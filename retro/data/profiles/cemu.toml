# Cemu — Wii U.
#
# Le SEUL des sept dont l'archive porte un dossier racine : Cemu_2.6\, listé
# dans l'archive dont le manifeste porte l'empreinte. `exe` porte donc ce
# préfixe, comme RetroArch et Dolphin — et l'antislash qu'il contient est
# exactement ce que `install.local_path` doit traduire hors Windows.
#
# Ce préfixe porte le NUMÉRO DE VERSION. Faire monter le manifeste à Cemu 2.7
# sans changer ce chemin ferait pointer Steam sur un exécutable inexistant,
# sans autre symptôme qu'un raccourci qui ne démarre pas.
#
# Les options sont lues DANS l'exécutable livré :
#   -f, --fullscreen ;
#   -g, --game <path> « Path of game to launch ».
# Cemu accepte au plus un argument positionnel, mais -g est explicite et ne
# dépend pas de sa place.
#
# La liste d'extensions vient du filtre du même exécutable : « All Wii U files
# (*.wud, *.wux, *.wua, *.wuhb, *.iso, *.rpx, *.elf) ».

schema = 1
id  = "cemu"
exe = 'Cemu_2.6\Cemu.exe'

# Amorçage : pas de bloc [[bootstrap]]. Ce que Cemu doit recevoir pour
# lancer un jeu au lieu de son assistant de première configuration reste À
# MESURER sur la machine, et aucune clé n'entre dans un profil sans avoir
# été relevée dans un fichier que l'émulateur a lui-même écrit — une clé
# recopiée d'une documentation est ignorée en silence, et le jeu ne démarre
# toujours pas. Ce bloc absent dit donc « personne n'a encore regardé », pas
# « cet émulateur se débrouille » : voir
# docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.
# Cas particulier, à trancher par la mesure : sa configuration vit peut-être
# SOUS le dossier d'installation, que « retro install » supprime à chaque
# montée de version. Si aucun dossier de données hors installation n'est
# exposé, le profil le dira, et l'amorçage se rejouera après chaque mise à
# jour — la cible ayant disparu avec le dossier.

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « dédiée », dont la cible SUPPOSÉE pour
# Cemu est controllerProfiles\ (un fichier par manette) — hypothèse du plan
# des manettes, jamais mesurée. Le nom de la clé, lui, n'a été relevé dans
# AUCUN fichier que Cemu a lui-même écrit ; recopié d'une documentation, il
# serait ignoré en silence et la manette resterait muette exactement comme
# aujourd'hui. Ce qui reste à relever, sur la machine : ce que Cemu écrit de
# lui-même une fois la vibration activée dans son interface — même méthode que
# pour l'identifiant de manette (tâche 1 du sous-projet E), et pour la même
# raison.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# L'exécutable livré n'annonce que des raccourcis CLAVIER pour le plein écran
# — « ALT + ENTER - toggle fullscreen », « ESC - leave fullscreen » — et
# aucune liaison manette par défaut n'ouvre son menu. Le fallback Steam Input
# est la seule sortie.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "wiiu"
name       = "Wii U"
folders    = ["WiiU", "Nintendo Wii U"]
# .elf est écarté : Cemu l'accepte, mais c'est un format de développement qui
# n'a rien à faire dans un dossier de jeux.
extensions = [".wud", ".wux", ".wua", ".wuhb", ".iso", ".rpx"]
launch     = '-f -g "{rom}"'
# Aucun BIOS : la Wii U n'en a pas d'équivalent dumpable, et Cemu démarre les
# jeux sans rien d'autre. Les clés de titre que réclament certains formats
# chiffrés ne sont pas des BIOS et ne se vérifient pas par empreinte.
bios       = []
