# Cemu — Wii U.
#
# Le SEUL des sept dont l'archive porte un dossier racine : Cemu_2.6\, listé
# dans l'archive dont le manifeste porte l'empreinte. `exe` porte donc ce
# préfixe, comme RetroArch et Dolphin — et l'antislash qu'il contient est
# exactement ce que `install.local_path` doit traduire hors Windows.
#
# Ce préfixe porte le NUMÉRO DE VERSION. Faire monter le manifeste à Cemu 2.7
# sans changer ce chemin ferait pointer Steam sur un exécutable inexistant,
# sans autre symptôme qu'un raccourci qui ne démarre pas.
#
# Les options sont lues DANS l'exécutable livré :
#   -f, --fullscreen ;
#   -g, --game <path> « Path of game to launch ».
# Cemu accepte au plus un argument positionnel, mais -g est explicite et ne
# dépend pas de sa place.
#
# La liste d'extensions vient du filtre du même exécutable : « All Wii U files
# (*.wud, *.wux, *.wua, *.wuhb, *.iso, *.rpx, *.elf) ».

schema = 1
id  = "cemu"
exe = 'Cemu_2.6\Cemu.exe'

# BOOTSTRAP — five targets, added on 2026-09-27, every value read in the
# source at v2.6 (a6fb0a4). None has been seen acting: no Wii U game is on the
# console yet.
#
# WHERE: without a "portable" folder or a settings.xml next to Cemu.exe,
# CemuApp::DeterminePaths (src/gui/CemuApp.cpp) keeps config and user data in
# %APPDATA%\Cemu. That is deliberate here: the install folder is wiped by
# every upgrade, and the emulated NAND (mlc01) with its saves lives under the
# same user data path. Nothing below may create settings.xml next to the exe.
#
# 1. settings.xml — WITHOUT IT, EVERY GAME HANGS ON A MODAL. CemuApp::OnInit
#    treats a missing settings.xml as a first start and opens the "Getting
#    Started" dialog (GettingStartedDialog::ShowModal) before any game: on a
#    console without a keyboard, a game that never starts. Posing the file
#    once skips it. `check_update` (CemuConfig.h, default true) is imposed
#    false: an update prompt is one more modal nobody can close.
#    `console_language` is what games read (coreinit_MCP.cpp, UCReadSysConfig
#    "cafe.language"): an integer, CafeConsoleLanguage in CemuConfig.h —
#    0 JA, 1 EN, 2 FR, 3 DE, 4 IT, 5 ES, 6 zh-Hans, 7 KO, 8 NL, 9 PT, 10 RU,
#    11 zh-Hant. Outside 0..11 it silently falls back to English
#    (ConfigValueBounds). The interface language is a wxLanguage integer that
#    depends on the wxWidgets build: not posed, it follows Windows.
#
# 2. controllerProfiles\controller0..3.xml — FOUR PLAYERS. Cemu creates no
#    profile on its own (InputManager::load reads controller<N>.xml or leaves
#    the player empty), and a profile without <mappings> is a deaf pad: the
#    defaults are only applied from the UI. Player 1 is the Wii U GamePad,
#    players 2 to 4 Pro Controllers (VPAD and WPAD channels, set_controller).
#    <api>XInput</api> and <uuid>N</uuid>: ControllerFactory turns the uuid
#    into XInputController(N), the XInput USER INDEX — no GUID, so four
#    identical Apollo pads map player N to pad N. The mappings are
#    set_default_mapping's XInput table (VPADController.cpp and
#    ProController.cpp), as numbers: the ButtonId enums on one side, the
#    Buttons2 enum (src/input/api/Controller.h) on the other.

[[bootstrap]]
target = '%APPDATA%\Cemu\settings.xml'
content = '''
<?xml version="1.0" encoding="UTF-8"?>
<!-- Écrit par « retro ». Ce fichier porte TROIS sortes de réglages : ce que la
     console IMPOSE et repose à chaque lancement (pas de recherche de mise à
     jour, la langue de la console), ce qu'elle a posé UNE FOIS — ce fichier
     lui-même, sans lequel Cemu ouvre son assistant —, et tout le reste, qui
     vous appartient : Cemu le réécrit lui-même. -->
<content>
</content>
'''
enforced = "<content><check_update>false</check_update></content>"

[bootstrap.langue]
repli = "english"
japanese   = "<content><console_language>0</console_language></content>"
english    = "<content><console_language>1</console_language></content>"
french     = "<content><console_language>2</console_language></content>"
german     = "<content><console_language>3</console_language></content>"
italian    = "<content><console_language>4</console_language></content>"
spanish    = "<content><console_language>5</console_language></content>"
latam      = "<content><console_language>5</console_language></content>"
schinese   = "<content><console_language>6</console_language></content>"
koreana    = "<content><console_language>7</console_language></content>"
dutch      = "<content><console_language>8</console_language></content>"
portuguese = "<content><console_language>9</console_language></content>"
brazilian  = "<content><console_language>9</console_language></content>"
russian    = "<content><console_language>10</console_language></content>"
tchinese   = "<content><console_language>11</console_language></content>"

