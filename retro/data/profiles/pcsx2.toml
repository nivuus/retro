# PCSX2 — PlayStation 2.
#
# L'archive épinglée au manifeste a été listée : 259 entrées, aucun dossier
# racine, pcsx2-qt.exe à la racine. `exe` est donc un nom plat.
#
# Les options sont lues DANS l'exécutable livré, celui dont le manifeste porte
# l'empreinte — « Usage: {} [parameters] [--] [boot filename] » :
#   -batch      « Enables batch mode (exits after shutting down) » ;
#   -nogui      « Hides main window while running (implies batch mode) » ;
#   -fullscreen « Enters fullscreen mode immediately after starting ».
# Sans -batch/-nogui, arrêter le jeu rend la fenêtre de bibliothèque de PCSX2,
# à la souris, au lieu de rendre la main à Steam.
#
# La liste d'extensions vient du filtre de fichiers du même exécutable :
# *.bin *.iso *.cue *.mdf *.chd *.cso *.zso *.gz *.dump.

schema = 1
id  = "pcsx2"
exe = 'pcsx2-qt.exe'

# Amorçage : UN bloc [[bootstrap]], plus bas. L'assistant obligatoire que ce
# commentaire annonçait comme « le prochain à mesurer » a été mesuré le
# 2026-08-29, sur un jeu réel : il s'ouvrait bien à la place de Need for
# Speed Underground 2. La manette l'a été le même jour, et les deux sont
# désormais imposés — le détail, et la provenance de chaque clé, sont dans le
# bloc lui-même.
#
# Ce qui reste hors du bloc est nommé là où il se décide : le chemin du BIOS,
# propre à chaque installation, pour la raison exacte qui tient le
# SearchDirectory de DuckStation dehors.

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « générale », dont la cible SUPPOSÉE pour
# PCSX2 est inis\PCSX2.ini — hypothèse du plan des manettes, jamais mesurée.
# Le nom de la clé, lui, n'a été relevé dans AUCUN fichier que PCSX2 a lui-
# même écrit ; recopié d'une documentation, il serait ignoré en silence et la
# manette resterait muette exactement comme aujourd'hui. Ce qui reste à
# relever, sur la machine : ce que PCSX2 écrit de lui-même une fois la
# vibration activée dans son interface — même méthode que pour l'identifiant
# de manette (tâche 1 du sous-projet E), et pour la même raison.
# --- AMORÇAGE : L'ASSISTANT, ET LA MANETTE. -------------------------------
#
# DEUX DÉFAUTS MESURÉS LE 2026-08-29, tous deux muets à leur façon.
#
# 1. L'ASSISTANT. Sans « SetupWizardIncomplete = false », PCSX2 ouvre son
#    assistant de première configuration AVANT le jeu et attend un clavier.
#    Mesuré : Need for Speed Underground 2 lancé depuis Steam ouvrait
#    l'assistant, pas le jeu. C'est le défaut de DuckStation qui se rejoue,
#    et le même remède.
#
# 2. LA MANETTE. [Pad1] était ENTIÈREMENT VIDE : PCSX2 voyait bien le
#    périphérique ([InputSources] SDL = true) mais aucune liaison n'existait,
#    donc aucun bouton ne répondait. C'est la dette D3 de DuckStation, mot
#    pour mot.
#
# ET IL FAUT L'IMPOSER, parce que PCSX2 REPREND CE FICHIER. Mesuré : après un
# lancement, [Pad1] était revenu à ses défauts CLAVIER (Cross = Keyboard/K).
# `Pad::SetDefaultControllerConfig` fait « ClearSection » puis réécrit Type,
# les réglages et les liaisons. Un régime « si-absent » ne poserait donc
# jamais rien sur une console déjà jouée, et ce qu'il aurait posé ne tiendrait
# pas. Ce n'est pas une préférence reprise au propriétaire : sans ces lignes,
# la manette est muette.
#
# CHAQUE NOM VIENT DE LA SOURCE DE PCSX2 v2.6.3, celle du manifeste :
#   les noms de liaison (Up, Cross, L2, LUp, LargeMotor…) et le type
#   « DualShock2 »  -> pcsx2/SIO/Pad/PadDualshock2.cpp, table ControllerInfo ;
#   la forme des valeurs (« SDL-0/FaceSouth », « SDL-0/+LeftY »)
#                   -> pcsx2/Input/SDLInputSource.cpp, GetGenericBindingMapping,
#                      qui formate « SDL-{}/{} » et « SDL-{}/{+|-}{} » ;
#   la correspondance bouton générique -> nom SDL
#                   -> s_sdl_generic_binding_button_mapping croisé avec
#                      s_sdl_button_setting_names.
#
# DEUX PORTS, ET DEUX SEULEMENT — ce n'est pas un arrêt à mi-chemin. La
# PlayStation 2 a deux prises de manette ; au-delà, il faut un multitap, que
# [Pad] MultitapPort1 activerait pour TOUS les jeux et qui renumérote les
# emplacements ([Pad3] à [Pad5]). Un jeu qui ne le gère pas voit alors un
# périphérique qu'il ne comprend pas là où il attendait une manette. Le
# matériel est la limite, pas ce profil.
#
# « SDL-1 » pour le second port : `SDLInputSource::ConvertKeyToString`
# (pcsx2/Input/SDLInputSource.cpp v2.6.3) formate « SDL-{} » à partir de
# `player_id`, l'index de joueur SDL — sur Windows, celui d'XInput. Comme
# « gamepad = x360 » est désormais épinglé côté Apollo, les quatre manettes
# virtuelles sont identiques et cet index EST le numéro de port.
#
# LE BOUTON PS RESTE LIBRE, DÉLIBÉRÉMENT. Le mappage automatique de PCSX2 lui
# donnerait « Analog » (Guide -> GenericInputBinding::System). Le propriétaire
# a demandé que ce bouton ne serve qu'à revenir à Steam : il n'est lié à rien.
# La contrepartie est qu'on ne bascule plus le mode analogique à la main ; la
# plupart des jeux PS2 l'activent eux-mêmes.
#
# LE BIOS N'ENTRE PAS ICI, pour la raison exacte qui tient le SearchDirectory
# de DuckStation dehors : « [Filenames] BIOS » nomme UN fichier, celui que ce
# propriétaire-là possède. Ce profil est livré, donc public. Y graver
# « ps2-0230e-20080220.bin » ferait, chez tous les autres, désigner un fichier
# absent — et PCSX2 ne démarrerait rien, sans que rien n'explique pourquoi.
[[bootstrap]]
target = '%USERPROFILE%\Documents\PCSX2\inis\PCSX2.ini'
content = """
; Écrit par « retro ». Ce fichier porte TROIS sortes de réglages : ce que la
; console IMPOSE et repose à chaque lancement (l'assistant et la manette),
; ce qu'elle a posé UNE FOIS et ne retouche plus, et tout le reste, qui vous
; appartient — PCSX2 le réécrit lui-même.
[UI]
StartFullscreen = true
ConfirmShutdown = false
"""
enforced = """
[UI]
SetupWizardIncomplete = false
[Pad1]
Type = DualShock2
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/FaceNorth
Circle = SDL-0/FaceEast
Cross = SDL-0/FaceSouth
Square = SDL-0/FaceWest
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LUp = SDL-0/-LeftY
LDown = SDL-0/+LeftY
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
RUp = SDL-0/-RightY
RDown = SDL-0/+RightY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
LargeMotor = SDL-0/LargeMotor
SmallMotor = SDL-0/SmallMotor
[Pad2]
Type = DualShock2
Up = SDL-1/DPadUp
Right = SDL-1/DPadRight
Down = SDL-1/DPadDown
Left = SDL-1/DPadLeft
Triangle = SDL-1/FaceNorth
Circle = SDL-1/FaceEast
Cross = SDL-1/FaceSouth
Square = SDL-1/FaceWest
Select = SDL-1/Back
Start = SDL-1/Start
L1 = SDL-1/LeftShoulder
R1 = SDL-1/RightShoulder
L2 = SDL-1/+LeftTrigger
R2 = SDL-1/+RightTrigger
L3 = SDL-1/LeftStick
R3 = SDL-1/RightStick
LUp = SDL-1/-LeftY
LDown = SDL-1/+LeftY
LLeft = SDL-1/-LeftX
LRight = SDL-1/+LeftX
RUp = SDL-1/-RightY
RDown = SDL-1/+RightY
RLeft = SDL-1/-RightX
RRight = SDL-1/+RightX
LargeMotor = SDL-1/LargeMotor
SmallMotor = SDL-1/SmallMotor
"""

[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# Comme DuckStation, PCSX2 ne lie aucun bouton de manette par défaut à
# l'ouverture de son menu de pause : la liaison est à faire dans ses réglages,
# et rien d'honnête ne peut être annoncé ici avant. -batch fait quitter
# l'application dès que le jeu est arrêté depuis ce menu.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "ps2"
name       = "PlayStation 2"
folders    = ["PS2"]
# .bin est écarté : c'est la piste brute d'un .cue, et la compter ferait une
# entrée Steam de trop par jeu. .gz et .dump le sont aussi — le premier est
# trop générique pour un dossier de ROMs, le second est un format de trace.
extensions = [".iso", ".chd", ".cso", ".zso", ".cue", ".mdf"]
launch     = '-batch -nogui -fullscreen "{rom}"'
# PCSX2 EXIGE un BIOS PS2 dumpé depuis sa propre console — il n'a aucune
# émulation de remplacement. Rien n'est déclaré ici pour autant, et c'est
# délibéré : PCSX2 ne cherche AUCUN nom de fichier particulier, il scanne son
# dossier bios\ et lit l'en-tête de ce qu'il y trouve. Il n'existe donc pas de
# couple (nom, md5) qui vaudrait pour tout le monde, et en inventer un ferait
# dire « corrompu » au rapport à quelqu'un qui a déposé un BIOS parfaitement
# valide sous un autre nom — l'accusation exacte que le mécanisme de groupes
# existe pour éviter. Un fichier non vérifiable vaut mieux non déclaré.
bios       = []
