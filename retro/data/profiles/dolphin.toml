[input]
steam_input   = "required"
mode          = "xinput"
mapping       = "pose"
mapping_where = 'GCPadNew.ini et WiimoteNew.ini, sous %APPDATA%\Dolphin Emulator\Config'
rumble        = "pose"
rumble_where  = 'Rumble/Motor, dans les mêmes deux fichiers'

[exit]
# Dolphin ne livre aucune combinaison manette de sortie par défaut : il n'y a
# rien d'honnête à déclarer ici. Le fallback Steam Input est la seule sortie.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "gamecube"
name       = "GameCube"
folders    = ["GC", "NGC", "Nintendo GameCube"]
extensions = [".iso", ".gcm", ".gcz", ".rvz", ".ciso", ".wia", ".tgc", ".dol", ".elf"]
launch     = '-b --config Dolphin.Display.Fullscreen=True --config Dolphin.Core.SIDevice1=6 --config Dolphin.Core.SIDevice2=6 --config Dolphin.Core.SIDevice3=6 {render} -e "{rom}"'
# Le BIOS GameCube (IPL) n'est utilisé que pour afficher l'animation de
# démarrage ; Dolphin joue sans lui. Rien à exiger.
bios       = []
cost       = "medium"
# La GameCube et la Wii sortent toutes deux en 480 lignes au maximum : c'est
# la hauteur par laquelle celle de la session se divise pour donner l'échelle.
[system.render]
native_height = 480
max_scale     = 12
[system.render.native]
args = '--config GFX.Settings.InternalResolution=1 --config GFX.Settings.AspectRatio=2'
crt_absent = "Dolphin n'embarque aucun shader CRT : ses shaders de post-traitement se déposent à la main dans Load\\Shaders\\, et l'archive épinglée n'en livre aucun."
fill_absent = "Dolphin n'expose AUCUN réglage de remplissage : la révision 2606a épinglée au manifeste ne déclare aucune clé portant « Integer » dans Source/Core/Core/Config/GraphicsSettings.cpp, son .h, ni dans Source/Core/VideoCommon/VideoConfig.h — les seuls réglages de cadrage y sont l'AspectMode et les clés Crop. Corroboré par les chaînes du Dolphin.exe livré, lues le 2026-08-29, où « Integer » ne désigne que des types, du JIT et des entrées OpenGL. NON VÉRIFIÉ : ce que Dolphin fait de lui-même sur cet axe — personne n'a regardé une partie."
[system.render.full]
args = '--config GFX.Settings.InternalResolution={scale} --config GFX.Settings.AspectRatio=0'
fill_absent = "Dolphin n'expose AUCUN réglage de remplissage : la révision 2606a épinglée au manifeste ne déclare aucune clé portant « Integer » dans Source/Core/Core/Config/GraphicsSettings.cpp, son .h, ni dans Source/Core/VideoCommon/VideoConfig.h — les seuls réglages de cadrage y sont l'AspectMode et les clés Crop. Corroboré par les chaînes du Dolphin.exe livré, lues le 2026-08-29, où « Integer » ne désigne que des types, du JIT et des entrées OpenGL. NON VÉRIFIÉ : ce que Dolphin fait de lui-même sur cet axe — personne n'a regardé une partie."


