# Dolphin — GameCube et Wii.
#
# Ce profil est le cas NON-RetroArch : pas de core à charger, une ligne de
# commande à lui. S'il tient dans ce schéma, les huit autres standalone y
# tiendront aussi.
#
# L'archive officielle n'a qu'un dossier racine, Dolphin-x64\ ; exe le porte en
# préfixe, comme pour RetroArch.
#
# -b (--batch) évite que Dolphin ouvre sa fenêtre de bibliothèque : sans lui,
# le propriétaire tombe sur une liste de jeux à la souris au lieu du jeu qu'il
# a lancé. -e (--exec) charge le fichier. Les deux options sont vérifiées dans
# Source/Core/UICommon/CommandLineParse.cpp de la révision 2606a, et la liste
# d'extensions vient du filtre de MainWindow::PromptFileNames de la même
# révision.
#
# Les trois modes de rendu passent par --config, qui est REPETABLE :
# ParseArguments appelle options.all("config") dans
# Source/Core/UICommon/CommandLineParse.cpp de la révision 2606a.
#
# Les deux réglages viennent de Source/Core/Core/Config/GraphicsSettings.cpp
# de la même révision :
#   GFX.Settings.InternalResolution — GFX_EFB_SCALE, défaut 1, c'est-à-dire
#     la résolution d'origine ; GFX_MAX_EFB_SCALE plafonne à 12 ;
#   GFX.Settings.AspectRatio — GFX_ASPECT_RATIO, un AspectMode dont l'ordre
#     est déclaré dans Source/Core/VideoCommon/VideoConfig.h : 0 = Auto,
#     1 = ForceWide (16:9), 2 = ForceStandard (4:3).
# Le mode natif force donc le 4:3 et la résolution d'origine ; le mode full
# laisse le ratio à Auto et multiplie la résolution interne par ce que la
# session peut afficher.
#
# LE TROISIÈME AXE — le remplissage — n'est PAS réglable ici, et c'est une
# réponse, pas un oubli : voir 'fill_absent' sous chaque mode. Le piège, pour
# qui chercherait à « remplir davantage », est juste à côté : l'enum AspectMode
# de Source/Core/VideoCommon/VideoConfig.h (révision 2606a) compte Auto = 0,
# ForceWide = 1, ForceStandard = 2, Stretch = 3, Custom = 4, CustomStretch = 5,
# Raw = 6. Stretch et CustomStretch ÉTIRENT l'image — c'est exactement ce que
# la console s'interdit — et Raw force des pixels carrés, donc abandonne le
# ratio d'époque, qui est le DEUXIÈME axe et pas celui-ci. Les valeurs 2 et 0
# retenues ci-dessus sont les seules qui ne déforment rien.
#
# Dolphin n'a AUCUNE option de plein écran : il se lançait donc en fenêtre sur
# la télévision, jeu compris — une panne muette, puisque le jeu tourne. Le
# plein écran est un réglage, que --config pose pour ce lancement seulement.
# La forme « <System>.<Section>.<Key>=<Value> » et le couple (Display,
# Fullscreen) sont lus DANS l'exécutable livré, celui dont le manifeste porte
# l'empreinte ; « Dolphin » y est le nom de système de Dolphin.ini.

schema = 1
id  = "dolphin"
exe = 'Dolphin-x64\Dolphin.exe'

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « pose » depuis le 2026-08-30 : les liaisons sont écrites et imposées — les
# deux blocs [[bootstrap]] ci-dessous —, mais personne n'a tenu de manette
# depuis que le type de périphérique virtuel a été épinglé. Ce n'est ni
# « a-relever », qui voudrait dire que rien n'est relevé, ni « releve », la
# seule affirmation de ce vocabulaire qui exige un témoin humain. Ce que le
# rapport doit dire est exactement cela : les liaisons sont là, leur réponse
# n'a pas été vue.
#
# Vibration : « pose » pour la même raison, et sur la même preuve.
# `Rumble/Motor` est désormais imposé sur les quatre ports, avec les deux
# sorties `Motor L` et `Motor R` que `named_motors` déclare dans
# Source/Core/InputCommon/ControllerInterface/XInput/XInput.cpp de la révision
# 2606a — le nom de la clé, lui, est relu dans le GCPadNew.ini que Dolphin
# avait lui-même écrit. Personne n'a SENTI la manette vibrer : la dette D1
# reste ouverte, et le maillon qui manque n'est pas ici mais dans le retour
# Apollo -> client, qui ne se mesure que dans sunshine.log.

# AMORÇAGE — LES QUATRE MANETTES, ET POURQUOI ELLES PEUVENT ENFIN ÊTRE
# ÉCRITES SANS NOMMER UN PÉRIPHÉRIQUE.
#
# Dolphin identifie une manette par un TRIPLET (source, index, nom) —
# `DeviceQualifier`, comparé champ à champ. Le nom en fait partie : une
# configuration qui dit « SDL/0/PS4 Controller » ne vaut que tant que le
# périphérique s'appelle ainsi, et une liaison qui ne correspond à rien est
# ignorée EN SILENCE. C'est ce qui rendait ces deux fichiers impossibles à
# livrer : le nom dépendait de la manette du joueur.
#
# Il n'en dépend plus, et c'est un réglage d'Apollo qui l'a tranché, pas une
# astuce d'écriture. La console ne voit JAMAIS la manette du joueur : Moonlight
# envoie des états abstraits et Apollo recrée un périphérique par ViGEmBus.
# Le gabarit sunshine.conf du dépôt « installer » épingle désormais
# « gamepad = x360 », qui fige la première branche de `alloc_gamepad`
# (src/platform/windows/input.cpp, Apollo v0.4.6) : quatre manettes Xbox 360
# filaires IDENTIQUES, quelles que soient les quatre manettes physiques que
# les joueurs tiennent, et quel que soit leur mélange. Sans cet
# épinglage, le type était choisi à chaque connexion par cinq branches, et
# deux types mélangés donnaient DEUX périphériques d'index 0 : l'index de
# Dolphin se compte par NOM (`AddDevice`, ControllerInterface.cpp), donc
# aucun ordre de ports n'était exprimable.
#
# D'où viennent les valeurs ci-dessous, et aucune n'est recopiée d'une
# documentation :
#   · « XInput », « Gamepad », « Button A », « Pad N », « Trigger L »,
#     « Left Y+ », « Motor L » — lus dans
#     Source/Core/InputCommon/ControllerInterface/XInput/XInput.cpp de la
#     révision 2606a, celle du manifeste : `named_buttons`, `named_triggers`,
#     `named_axes` (suffixés « + » ou « - » par `Axis::GetName`),
#     `named_motors`, `Device::GetName()` qui rend « Gamepad » pour un
#     XINPUT_DEVSUBTYPE_GAMEPAD, et `Device::GetSource()` qui rend « XInput ».
#   · l'index 0 à 3 — `Device::GetPreferredId()` du même fichier rend
#     `m_index`, l'index utilisateur XInput. Ce n'est donc PAS un ordre
#     d'énumération : le port 1 est la manette XInput 0, toujours.
#   · la STRUCTURE (quelles clés existent, sous quels noms) — relue le
#     2026-08-30 dans le GCPadNew.ini et le WiimoteNew.ini que la console
#     portait, dont le propriétaire a confirmé le 2026-08-29 qu'ils faisaient
#     répondre la GameCube et la Wii. Seule la ligne `Device` change.
#
# CE QUI N'A PAS ÉTÉ MESURÉ, et que `[input] mapping = "pose"` dit : personne
# n'a encore tenu une manette après l'épinglage. Les noms de contrôles sont
# prouvés par la source, le périphérique ne l'est pas.
#
# `%APPDATA%` et non `Documents` : `SetUserDirectory` (UICommon.cpp, révision
# 2606a) essaie six cas dans l'ordre, et sur une console neuve — pas de
# portable.txt, pas de clé de registre, pas de `Documents\Dolphin Emulator` —
# c'est le cas 5 qui gagne. Vérifié sur la machine : la clé
# HKCU\Software\Dolphin Emulator\UserConfigPath y pointe.
#
# `enforced` et non `content` : Dolphin RÉÉCRIT ces deux fichiers dès qu'on
# ferme sa fenêtre de configuration (`InputConfig::SaveConfig`). Le régime
# « si-absent » ne les reposerait donc jamais sur une console déjà jouée, qui
# est très exactement celle-ci.

[[bootstrap]]
target = '%APPDATA%\Dolphin Emulator\Config\GCPadNew.ini'
content = """#
# Écrit par « retro ». Ce fichier porte TROIS sortes de réglages : ce que la
# console IMPOSE et repose à chaque lancement — les quatre manettes, leurs
# liaisons et leur vibration —, ce qu'elle a posé UNE FOIS et ne retouche
# plus, et tout le reste, qui vous appartient : Dolphin le réécrit lui-même
# dès que vous fermez sa fenêtre de configuration.
#
# « # » est le seul caractère de commentaire que Dolphin reconnaisse
# (Common/IniFile.cpp, révision 2606a : `line.front() == '#'`).
"""
enforced = """
[GCPad1]
Device = XInput/0/Gamepad
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/X = `Button X`
Buttons/Y = `Button Y`
Buttons/Z = `Shoulder R`
Buttons/Start = `Start`
Main Stick/Up = `Left Y+`
Main Stick/Down = `Left Y-`
Main Stick/Left = `Left X-`
Main Stick/Right = `Left X+`
Main Stick/Calibration = 100.00
C-Stick/Up = `Right Y+`
C-Stick/Down = `Right Y-`
C-Stick/Left = `Right X-`
C-Stick/Right = `Right X+`
