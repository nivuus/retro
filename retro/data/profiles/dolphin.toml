# Dolphin — GameCube et Wii.
#
# Ce profil est le cas NON-RetroArch : pas de core à charger, une ligne de
# commande à lui. S'il tient dans ce schéma, les huit autres standalone y
# tiendront aussi.
#
# L'archive officielle n'a qu'un dossier racine, Dolphin-x64\ ; exe le porte en
# préfixe, comme pour RetroArch.
#
# -b (--batch) évite que Dolphin ouvre sa fenêtre de bibliothèque : sans lui,
# le propriétaire tombe sur une liste de jeux à la souris au lieu du jeu qu'il
# a lancé. -e (--exec) charge le fichier. Les deux options sont vérifiées dans
# Source/Core/UICommon/CommandLineParse.cpp de la révision 2606a, et la liste
# d'extensions vient du filtre de MainWindow::PromptFileNames de la même
# révision.
#
# Les trois modes de rendu passent par --config, qui est REPETABLE :
# ParseArguments appelle options.all("config") dans
# Source/Core/UICommon/CommandLineParse.cpp de la révision 2606a.
#
# Les deux réglages viennent de Source/Core/Core/Config/GraphicsSettings.cpp
# de la même révision :
#   GFX.Settings.InternalResolution — GFX_EFB_SCALE, défaut 1, c'est-à-dire
#     la résolution d'origine ; GFX_MAX_EFB_SCALE plafonne à 12 ;
#   GFX.Settings.AspectRatio — GFX_ASPECT_RATIO, un AspectMode dont l'ordre
#     est déclaré dans Source/Core/VideoCommon/VideoConfig.h : 0 = Auto,
#     1 = ForceWide (16:9), 2 = ForceStandard (4:3).
# Le mode natif force donc le 4:3 et la résolution d'origine ; le mode full
# laisse le ratio à Auto et multiplie la résolution interne par ce que la
# session peut afficher.
#
# Dolphin n'a AUCUNE option de plein écran : il se lançait donc en fenêtre sur
# la télévision, jeu compris — une panne muette, puisque le jeu tourne. Le
# plein écran est un réglage, que --config pose pour ce lancement seulement.
# La forme « <System>.<Section>.<Key>=<Value> » et le couple (Display,
# Fullscreen) sont lus DANS l'exécutable livré, celui dont le manifeste porte
# l'empreinte ; « Dolphin » y est le nom de système de Dolphin.ini.

schema = 1
id  = "dolphin"
exe = 'Dolphin-x64\Dolphin.exe'

# Amorçage : pas de bloc [bootstrap]. Ce que Dolphin doit recevoir pour
# lancer un jeu au lieu de son assistant de première configuration reste À
# MESURER sur la machine, et aucune clé n'entre dans un profil sans avoir
# été relevée dans un fichier que l'émulateur a lui-même écrit — une clé
# recopiée d'une documentation est ignorée en silence, et le jeu ne démarre
# toujours pas. Ce bloc absent dit donc « personne n'a encore regardé », pas
# « cet émulateur se débrouille » : voir
# docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.

[input]
steam_input = "required"
mode        = "xinput"

[exit]
# Dolphin ne livre aucune combinaison manette de sortie par défaut : il n'y a
# rien d'honnête à déclarer ici. Le fallback Steam Input est la seule sortie.
native   = ""
fallback = "alt+f4"

[[system]]
id         = "gamecube"
name       = "GameCube"
folders    = ["GC", "NGC", "Nintendo GameCube"]
extensions = [".iso", ".gcm", ".gcz", ".rvz", ".ciso", ".wia", ".tgc", ".dol", ".elf"]
launch     = '-b --config Dolphin.Display.Fullscreen=True {render} -e "{rom}"'
# Le BIOS GameCube (IPL) n'est utilisé que pour afficher l'animation de
# démarrage ; Dolphin joue sans lui. Rien à exiger.
bios       = []
cost       = "medium"
# La GameCube et la Wii sortent toutes deux en 480 lignes au maximum : c'est
# la hauteur par laquelle celle de la session se divise pour donner l'échelle.
[system.render]
native_height = 480
max_scale     = 12
[system.render.native]
args = '--config GFX.Settings.InternalResolution=1 --config GFX.Settings.AspectRatio=2'
crt_absent = "Dolphin n'embarque aucun shader CRT : ses shaders de post-traitement se déposent à la main dans Load\\Shaders\\, et l'archive épinglée n'en livre aucun."
[system.render.full]
args = '--config GFX.Settings.InternalResolution={scale} --config GFX.Settings.AspectRatio=0'


[[system]]
id         = "wii"
name       = "Wii"
folders    = ["Nintendo Wii"]
extensions = [".iso", ".wbfs", ".rvz", ".gcz", ".ciso", ".wia", ".wad"]
launch     = '-b --config Dolphin.Display.Fullscreen=True {render} -e "{rom}"'
bios       = []
cost       = "medium"
# La GameCube et la Wii sortent toutes deux en 480 lignes au maximum : c'est
# la hauteur par laquelle celle de la session se divise pour donner l'échelle.
[system.render]
native_height = 480
max_scale     = 12
[system.render.native]
args = '--config GFX.Settings.InternalResolution=1 --config GFX.Settings.AspectRatio=2'
crt_absent = "Dolphin n'embarque aucun shader CRT : ses shaders de post-traitement se déposent à la main dans Load\\Shaders\\, et l'archive épinglée n'en livre aucun."
[system.render.full]
args = '--config GFX.Settings.InternalResolution={scale} --config GFX.Settings.AspectRatio=0'
