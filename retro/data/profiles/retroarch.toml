# RetroArch — les systèmes rétro, un core libretro par système.
#
# Les chemins relatifs sont résolus depuis D:\Emulation\<install_dir>, et
# l'archive livrée par le buildbot n'a qu'un dossier racine, RetroArch-Win64\ :
# c'est pourquoi exe et les cores le portent en préfixe. Retirer ce préfixe
# ferait pointer Steam sur un exécutable inexistant, sans autre symptôme qu'un
# raccourci qui ne démarre pas.
#
# Les noms de core, les extensions et les BIOS ne sont pas devinés : ils sont
# repris des fichiers RetroArch-Win64\info\*_libretro.info livrés DANS
# l'archive dont l'empreinte est au manifeste, et les empreintes MD5 des BIOS
# de la documentation libretro (docs.libretro.com).

schema = 1
id  = "retroarch"
exe = 'RetroArch-Win64\retroarch.exe'

# Amorçage : pas de bloc [[bootstrap]]. Ce que RetroArch doit recevoir pour
# lancer un jeu au lieu de son assistant de première configuration reste À
# MESURER sur la machine, et aucune clé n'entre dans un profil sans avoir
# été relevée dans un fichier que l'émulateur a lui-même écrit — une clé
# recopiée d'une documentation est ignorée en silence, et le jeu ne démarre
# toujours pas. Ce bloc absent dit donc « personne n'a encore regardé », pas
# « cet émulateur se débrouille » : voir
# docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.
# Cas particulier, à trancher par la mesure : sa configuration vit peut-être
# SOUS le dossier d'installation, que « retro install » supprime à chaque
# montée de version. Si aucun dossier de données hors installation n'est
# exposé, le profil le dira, et l'amorçage se rejouera après chaque mise à
# jour — la cible ayant disparu avec le dossier.
# Le chemin des BIOS en fera partie : « retro status --bios » vérifie le
# dossier que le propriétaire a choisi pendant que l'émulateur cherche dans
# le sien, et sans ce réglage le rapport annonce « BIOS présent » alors que
# l'émulateur ne les voit pas — le pire des états, un rapport qui ment.

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « dédiée », dont la cible SUPPOSÉE pour
# RetroArch est autoconfig\*.cfg — hypothèse du plan des manettes, jamais
# mesurée. Le nom de la clé, lui, n'a été relevé dans AUCUN fichier que
# RetroArch a lui-même écrit ; recopié d'une documentation, il serait ignoré
# en silence et la manette resterait muette exactement comme aujourd'hui. Ce
# qui reste à relever, sur la machine : ce que RetroArch écrit de lui-même une
# fois la vibration activée dans son interface — même méthode que pour
# l'identifiant de manette (tâche 1 du sous-projet E), et pour la même raison.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# Hotkey RetroArch par défaut : la touche « hotkey enable » est Select, et
# Select+Start quitte. Le fallback reste indispensable : un core qui fige ne
# traite plus la hotkey, alors que Steam Input envoie toujours alt+F4.
native   = "Select+Start"
fallback = "alt+f4"

[[system]]
id         = "nes"
name       = "Nintendo Entertainment System"
folders    = ["NES", "Famicom", "Nintendo NES"]
extensions = [".nes", ".fds", ".unf", ".unif"]
launch     = '-L "RetroArch-Win64\cores\mesen_libretro.dll" {render} -f "{rom}"'
# disksys.rom n'est requis que pour le Famicom Disk System (.fds) ; les
# cartouches s'en passent. Déclaré optionnel pour cette raison.
bios       = [
  { file = "disksys.rom", md5 = "ca30b50f880eb660a320674ed365ef7a", required = false },
]
cost       = "light"
[system.render.native]
# Le shader est le mode natif : « ce que la console d'origine fournissait »
# sortait d'un tube cathodique, et une image propre n'est pas ce qu'elle
# rendait. Le chemin est RELATIF, rebasé par RetroArch sur video_shader_dir —
# case RA_OPT_SET_SHADER de retroarch.c, révision 1.22.2 — d'où le réglage du
# dossier dans le fichier ci-dessous : sans lui, un dossier déplacé ferait
# chercher le shader ailleurs, en silence.
args = '--appendconfig "{render_config}"'
crt  = '--set-shader "shaders_slang/crt/crt-geom.slangp"'
# crt-geom en SLANG et non en GLSL : le pilote vidéo mesuré sur la machine est
# d3d11, qui lit les presets slang et ignore les glsl. Un preset de la mauvaise
# famille n'est pas une erreur bruyante — il ne s'applique pas, et le jeu a
# l'air normal.
# Remplissage (le TROISIÈME axe) : ENTIER — le plus grand multiple entier qui
# tienne, ratio conservé, le reste en bande noire.
#
# Les trois clés sont lues dans la révision 1.22.2 ÉPINGLÉE AU MANIFESTE, et
# c'est la preuve reproductible — n'importe qui peut rouvrir ces fichiers :
#   video_scale_integer, video_scale_integer_axis et
#   video_scale_integer_scaling sont enregistrées dans configuration.c, et
#   leurs valeurs par défaut (false, 0, 0) dans config.def.h ;
#   aucune des trois n'a d'option en ligne de commande — l'aide intégrée de
#   retroarch.exe ne porte que --appendconfig=FILE et --set-shader=PATH pour
#   toucher au rendu. Elles passent donc par le fichier ci-dessus, comme le
#   shader.
# Corroboré le 2026-08-29 par une lecture du retroarch.cfg que RetroArch avait
# lui-même écrit sur la console (invité en provision_version=B1), où les trois
# clés figurent à ces valeurs. Cette lecture n'est PAS reproductible depuis
# l'hôte — l'accès à l'invité s'est refermé — donc elle confirme, elle ne
# fonde pas.
#
# Le sens des deux valeurs, dans la même révision :
#   axis = 0 (VIDEO_SCALE_INTEGER_AXIS_Y, enum de gfx/video_defines.h) : le
#     multiple entier porte sur la HAUTEUR seule, la largeur restant celle du
#     ratio. C'est ce qui empêche la déformation —
#     video_viewport_get_scaled_integer de gfx/video_driver.c dérive la
#     largeur de content_height * aspect_ratio (« Account for non-square
#     pixels ») et ne touche à la largeur que pour les axes >= Y_X.
#   scaling = 0 (VIDEO_SCALE_INTEGER_SCALING_UNDERSCALE) : le plus grand
#     multiple qui TIENNE, jamais celui qui déborde — donc de la bande noire
#     plutôt qu'une image rognée.
# CE QUI RESTE NON VÉRIFIÉ : le résultat À L'ÉCRAN. Les émulateurs tournent
# sur l'invité Windows et personne n'a encore regardé une partie avec ce
# réglage posé.
fill = "entier"
config = '''
video_shader_enable = "true"
video_shader_dir = ":\shaders"
aspect_ratio_index = "0"
video_aspect_ratio_auto = "false"
video_force_aspect = "true"
video_scale_integer = "true"
video_scale_integer_axis = "0"
video_scale_integer_scaling = "0"
'''
[system.render.full]
# Pas de shader, et le ratio que le cœur annonce (ASPECT_RATIO_CORE = 22 dans
# l'enum aspect_ratio de gfx/video_defines.h, révision 1.22.2). Le shader doit
# être ÉTEINT explicitement : un préréglage retenu d'une partie précédente
# s'appliquerait sinon par-dessus, et « full » rendrait du CRT.
args = '--appendconfig "{render_config}"'
# Remplissage : AJUSTE — le plus grand agrandissement qui tienne, ratio
# conservé. La mise à l'échelle entière est ÉTEINTE EXPLICITEMENT, pour la
# raison exacte qui fait éteindre le shader ici : RetroArch RÉÉCRIT son
# retroarch.cfg en quittant, donc un réglage posé par --appendconfig lors
# d'une partie précédente y reste. Le retroarch.cfg lu sur la console le
# 2026-08-29 portait bien aspect_ratio_index = "22", la valeur que ce mode-ci
# écrit — indice, non reproductible depuis l'hôte. Sans cette ligne, « full »
# remplirait moins que « natif » après une seule partie en natif.
# Éteinte, RetroArch retombe sur son cadrage ordinaire, qui conserve le
# ratio — video_viewport_get_scaled_aspect, gfx/video_driver.c, 1.22.2.
fill = "ajuste"
config = '''
video_shader_enable = "false"
aspect_ratio_index = "22"
video_aspect_ratio_auto = "false"
video_scale_integer = "false"
'''

