[[system]]
id         = "n64"
name       = "Nintendo 64"
folders    = ["N64", "Nintendo64"]
extensions = [".n64", ".v64", ".z64", ".ndd"]
launch     = '-L "RetroArch-Win64\cores\mupen64plus_next_libretro.dll" {render} -f "{rom}"'
bios       = []

# « psx » n'est PLUS servi ici : DuckStation le sert, dans son propre profil.
# Il est plus fidèle que Beetle PSX HW, gère seul le plein écran et la sortie
# propre, et deux profils livrés ne peuvent pas revendiquer le même dossier de
# ROMs — le scan trancherait par ordre alphabétique. Le groupe de BIOS des
# trois SCPH a suivi le système, dans duckstation.toml.
cost       = "medium"
[system.render.native]
# Le shader est le mode natif : « ce que la console d'origine fournissait »
# sortait d'un tube cathodique, et une image propre n'est pas ce qu'elle
# rendait. Le chemin est RELATIF, rebasé par RetroArch sur video_shader_dir —
# case RA_OPT_SET_SHADER de retroarch.c, révision 1.22.2 — d'où le réglage du
