# RetroArch — les systèmes rétro, un core libretro par système.
#
# Les chemins relatifs sont résolus depuis D:\Emulation\<install_dir>, et
# l'archive livrée par le buildbot n'a qu'un dossier racine, RetroArch-Win64\ :
# c'est pourquoi exe et les cores le portent en préfixe. Retirer ce préfixe
# ferait pointer Steam sur un exécutable inexistant, sans autre symptôme qu'un
# raccourci qui ne démarre pas.
#
# Les noms de core, les extensions et les BIOS ne sont pas devinés : ils sont
# repris des fichiers RetroArch-Win64\info\*_libretro.info livrés DANS
# l'archive dont l'empreinte est au manifeste, et les empreintes MD5 des BIOS
# de la documentation libretro (docs.libretro.com).

schema = 1
id  = "retroarch"
exe = 'RetroArch-Win64\retroarch.exe'

[input]
steam_input = "required"
mode        = "xinput"

[exit]
# Hotkey RetroArch par défaut : la touche « hotkey enable » est Select, et
# Select+Start quitte. Le fallback reste indispensable : un core qui fige ne
# traite plus la hotkey, alors que Steam Input envoie toujours alt+F4.
native   = "Select+Start"
fallback = "alt+f4"

[[system]]
id         = "nes"
name       = "Nintendo Entertainment System"
folders    = ["NES", "Famicom", "Nintendo NES"]
extensions = [".nes", ".fds", ".unf", ".unif"]
launch     = '-L "RetroArch-Win64\cores\mesen_libretro.dll" {render} -f "{rom}"'
# disksys.rom n'est requis que pour le Famicom Disk System (.fds) ; les
# cartouches s'en passent. Déclaré optionnel pour cette raison.
bios       = [
  { file = "disksys.rom", md5 = "ca30b50f880eb660a320674ed365ef7a", required = false },
]
cost       = "light"
[system.render.native]
# Le shader est le mode natif : « ce que la console d'origine fournissait »
# sortait d'un tube cathodique, et une image propre n'est pas ce qu'elle
# rendait. Le chemin est RELATIF, rebasé par RetroArch sur video_shader_dir —
# case RA_OPT_SET_SHADER de retroarch.c, révision 1.22.2 — d'où le réglage du
# dossier dans le fichier ci-dessous : sans lui, un dossier déplacé ferait
# chercher le shader ailleurs, en silence.
args = '--appendconfig "{render_config}"'
crt  = '--set-shader "shaders_slang/crt/crt-geom.slangp"'
# crt-geom en SLANG et non en GLSL : le pilote vidéo mesuré sur la machine est
# d3d11, qui lit les presets slang et ignore les glsl. Un preset de la mauvaise
# famille n'est pas une erreur bruyante — il ne s'applique pas, et le jeu a
# l'air normal.
config = '''
video_shader_enable = "true"
video_shader_dir = ":\shaders"
aspect_ratio_index = "0"
video_aspect_ratio_auto = "false"
video_force_aspect = "true"
'''
[system.render.full]
# Pas de shader, et le ratio que le cœur annonce (ASPECT_RATIO_CORE = 22 dans
# l'enum aspect_ratio de gfx/video_defines.h, révision 1.22.2). Le shader doit
# être ÉTEINT explicitement : un préréglage retenu d'une partie précédente
# s'appliquerait sinon par-dessus, et « full » rendrait du CRT.
args = '--appendconfig "{render_config}"'
config = '''
video_shader_enable = "false"
aspect_ratio_index = "22"
video_aspect_ratio_auto = "false"
'''

