# Flycast — Dreamcast.
#
# L'archive épinglée au manifeste ne contient qu'UNE entrée : flycast.exe, à
# la racine. `exe` est donc un nom plat, et il n'y a rien d'autre à extraire.
#
# La ligne de commande vient de core/cfg/cl.cpp de la révision v2.7, celle dont
# le manifeste porte l'empreinte — « Usage: flycast [option]... [<rom path>] ».
# Flycast n'a PAS d'option -fullscreen : le plein écran est une valeur de
# configuration, que -config pose de façon transitoire, sans réécrire l'emu.cfg
# du propriétaire. La clé est lue dans core/sdl/sdl.cpp de la même révision —
# config::loadBool("window", "fullscreen", ...) — et « yes » est l'une des
# quatre valeurs vraies que IniFile::getBool accepte.
#
# La liste d'extensions vient de core/ui/gui_util.cpp de cette révision : zip,
# 7z, chd, gdi, cdi, cue, plus bin/lst/dat réservés à l'arcade. Les quatre
# formats de disque Dreamcast sont retenus ; zip et 7z sont des romsets NAOMI,
# qui ne sont pas des jeux Dreamcast et n'ont rien à faire dans ce dossier.

schema = 1
id  = "flycast"
exe = 'flycast.exe'

# Amorçage : pas de bloc [[bootstrap]]. Ce que Flycast doit recevoir pour
# lancer un jeu au lieu de son assistant de première configuration reste À
# MESURER sur la machine, et aucune clé n'entre dans un profil sans avoir
# été relevée dans un fichier que l'émulateur a lui-même écrit — une clé
# recopiée d'une documentation est ignorée en silence, et le jeu ne démarre
# toujours pas. Ce bloc absent dit donc « personne n'a encore regardé », pas
# « cet émulateur se débrouille » : voir
# docs/superpowers/specs/2026-08-28-amorcage-emulateurs-design.md.
# Le chemin des BIOS en fera partie : « retro status --bios » vérifie le
# dossier que le propriétaire a choisi pendant que l'émulateur cherche dans
# le sien, et sans ce réglage le rapport annonce « BIOS présent » alors que
# l'émulateur ne les voit pas — le pire des états, un rapport qui ment.

# `mapping` dit où en est le RELEVÉ de la manette de cet émulateur, et jamais
# l'identifiant lui-même : un identifiant n'est pas une propriété du
# périphérique, c'est une propriété de l'émulateur qui le nomme, et le seul
# relevé valide est celui que l'émulateur écrit lui-même dans sa propre
# configuration (plan des manettes, tâche 1 — quatre identifiants relevés pour
# une seule manette physique, un seul bon).
#
# « inconnu » : personne n'a vérifié, le pad en main, que la manette répond
# dans cet émulateur. Ce n'est PAS « il se débrouille » — le plan des manettes
# le supposait de DuckStation, et c'était faux (dette D3). Les deux seules
# lignes mesurées de son tableau sont l'émulateur personnel et DuckStation ;
# celle-ci n'en est pas. `retro status` le nomme sans l'accuser.
#
# Vibration : l'ÉTAT vit désormais dans le champ `rumble` du bloc [input]
# ci-dessous — « inconnu » ici, et `retro status` le nomme. Ce commentaire ne
# porte plus l'aveu, il porte la PROVENANCE : pourquoi rien n'est posé, où ça
# irait, et ce qui reste à relever. Le jour où un relevé aboutit, c'est le
# CHAMP qui bascule et la cible supposée ci-dessous qui devient mesurée.
#
# Aucun réglage de rumble n'est posé ici, et ce n'est pas un
# oubli. La manette ne vibre NULLE PART — ni dans cet émulateur, ni dans les
# jeux Steam, ni depuis le client Moonlight — et aucun des trois maillons n'a
# été mesuré : dette D1 de docs/dettes.md. Le rumble est un réglage de la
# configuration d'entrée, pas de la ligne de commande : il ira dans le gabarit
# d'entrée du sous-projet E, famille « générale », dont la cible SUPPOSÉE pour
# Flycast est emu.cfg — hypothèse du plan des manettes, jamais mesurée. Le nom
# de la clé, lui, n'a été relevé dans AUCUN fichier que Flycast a lui-même
# écrit ; recopié d'une documentation, il serait ignoré en silence et la
# manette resterait muette exactement comme aujourd'hui. Ce qui reste à
# relever, sur la machine : ce que Flycast écrit de lui-même une fois la
# vibration activée dans son interface — même méthode que pour l'identifiant
# de manette (tâche 1 du sous-projet E), et pour la même raison.
[input]
steam_input = "required"
mode        = "xinput"
mapping     = "inconnu"
rumble      = "inconnu"

[exit]
# Vérifié dans core/sdl/sdl_gamepad.cpp (v2.7) : la mise en correspondance par
# défaut lie SDL_CONTROLLER_BUTTON_BACK — Select — à EMU_BTN_MENU. Le menu de
# Flycast s'ouvre donc à la manette sans rien configurer, et il offre « Exit ».
native   = "Back (Select) puis Exit"
fallback = "alt+f4"

[[system]]
id         = "dreamcast"
name       = "Dreamcast"
folders    = ["Sega Dreamcast", "DC"]
extensions = [".chd", ".gdi", ".cdi", ".cue"]
launch     = '-config window:fullscreen=yes {render} "{rom}"'
# dc_boot.bin est FACULTATIF : l'exécutable livré porte « Forcing HLE BIOS »
# et l'option « HLE BIOS », et docs.libretro.com marque ce fichier « Optional »
# — c'est aussi de là que vient son MD5, la seule empreinte publiquement
# citable pour ce dump. Même statut que gba_bios.bin côté RetroArch : il
# améliore la fidélité, il ne conditionne pas le lancement.
#
# Flycast accepte aussi ce dump sous le nom dc_bios.bin. Ce second nom n'est
# PAS déclaré : rien ici ne permet de vérifier que les deux portent le même
# contenu, et déclarer le mauvais couple ferait dire « corrompu » à propos d'un
# fichier valide — pire qu'un fichier non déclaré.
bios       = [
  { file = "dc_boot.bin", md5 = "e10c53c2f8b90bab96ead2d368858623", required = false },
]

# Dreamcast : entre la PlayStation (« light ») et la GameCube (« medium »).
# « medium » est retenu par prudence, et c'est un ARBITRAGE, pas une mesure :
# personne n'a chronométré une partie sur cette machine. Le coût ne décide que
# de ce que le mode « auto » retient par classe de machine — se tromper coûte
# un mode moins ambitieux, jamais une image fausse.
cost       = "medium"

# --- LE RENDU (dette D2) --------------------------------------------------
#
# FLYCAST EST LE SEUL DES SEPT ÉMULATEURS SANS BLOC DE RENDU QUI PUISSE EN
# RECEVOIR UN SANS RIEN INVENTER, et c'est son « -config » qui le permet.
# Relevé le 2026-09-04 sur la révision v2.7, celle dont le manifeste porte
# l'empreinte :
#
#   core/cfg/cl.cpp, chaîne d'usage de l'exécutable lui-même :
#       -config section:key=value,...  set a transient config value.
#                                      Transient config values won't be saved
#                                      to emu.cfg.
#
# TRANSITOIRE, et c'est vérifié à deux niveaux dans la source plutôt que cru
# sur parole : `IniFile::setRaw` écrit dans `entry.transientValue` et jamais
# dans `entry.value` (core/cfg/ini.cpp), et `IniFile::save` saute les entrées
# transitoires. L'emu.cfg du propriétaire n'est donc PAS réécrit — c'est ce
# qui permet de poser un rendu par lancement sans lui reprendre ses réglages,
# et c'est exactement ce que le régime « enforced » doit faire ailleurs à
# grands frais.
#
# ⚠ LA SECTION EST LE MOT « config », ET LE DRAPEAU AUSSI. « -config config:… »
# a l'air d'une faute de frappe et c'est la forme juste : dans
# core/cfg/option.h, le paramètre `section` du constructeur d'`Option` vaut
# "config" par défaut, et le « rend. » fait partie du NOM DE LA CLÉ, pas de la
# section. « -config rend:Resolution=… » créerait une section « [rend] » que
# Flycast ne lit jamais, sans un mot.
#
# ⚠ TROIS PIÈGES DE FORME, chacun du genre qui pose une clé d'apparence juste
# qui ne fait rien :
#   · rend.IntegerScale porte le S majuscule de rend.WideScreen, quand ses
#     voisins rend.WidescreenGameHacks et rend.ScreenStretching l'ont
#     minuscule. Casse incohérente entre clés voisines ;
#   · le symbole C++ est `RenderResolution` mais la clé est `rend.Resolution` ;
#   · rend.Resolution est une HAUTEUR EN PIXELS, pas un multiplicateur —
#     core/rend/transform_matrix.cpp : `float upscaling = RenderResolution /
#     480.f`. C'est de là que vient le 480 du mode natif, et c'est une lecture
#     du calcul, pas une supposition sur le matériel.
#
# ⚠ ET LE PIÈGE QUI COMPTE LE PLUS, parce qu'il produit très exactement
# l'image floue que D2 existe pour empêcher : rend.LinearInterpolation a pour
# défaut **true** (core/cfg/option.cpp). Rien dans le code ne l'éteint quand
# la mise à l'échelle entière est active — vérifié, les deux réglages ne se
# consultent nulle part. Poser IntegerScale sans éteindre celui-là donnerait
# un multiple entier repassé au filtre linéaire : une image qu'on croirait
# normale. L'infobulle de Flycast le dit elle-même (« Disable with integer
# scaling »), mais une infobulle n'éteint rien.
#
# AUCUNE DES VALEURS POSÉES N'EST UN DÉFAUT DE FLYCAST — Resolution 480,
# IntegerScale false, LinearInterpolation true. C'est la leçon du TROISIÈME
# faux oracle de D2 : un essai dont la valeur posée est le défaut de
# l'émulateur ne prouve rien, pas même que la clé a été lue.
#
# 🔴 CE QUI N'EST PAS VÉRIFIÉ, ET C'EST TOUT CE QUI COMPTE VRAIMENT : le
# résultat À L'ÉCRAN. Personne n'a regardé une partie avec ces réglages posés.
# La mesure exige la console, elle est due, et rien ici ne la remplace.
[system.render]
# native_height et max_scale ne sont PAS déclarés : ils ne sont exigés que par
# {scale}, et ce profil ne l'emploie pas. rend.Resolution attend des pixels,
# donc c'est {height} — la hauteur de la session — qui va directement dedans,
# sans division ni plafond intermédiaires.
[system.render.native]
# La trame d'origine (480 lignes), agrandie du plus grand multiple ENTIER qui
# tienne, sans filtre par-dessus.
args = '-config config:rend.Resolution=480,rend.IntegerScale=yes,rend.LinearInterpolation=no'
crt_absent = "Flycast n'embarque aucun shader CRT accessible en ligne de commande : la révision v2.7 n'expose sur ce point que rend.LinearInterpolation, un filtre de mise à l'échelle et non une simulation de tube. NON VÉRIFIÉ : ce que Flycast rend de lui-même — personne n'a regardé une partie."
fill = "entier"
[system.render.full]
# La résolution interne montée à la hauteur de la session, et la mise à
# l'échelle entière ÉTEINTE EXPLICITEMENT : une fois la trame montée, il n'y a
# plus de trame à préserver, et un multiple entier ne ferait que rendre des
# bandes noires plus grandes. Le filtre linéaire revient à son défaut, qui est
# celui que Flycast emploie hors mise à l'échelle entière — il est écrit
# quand même, parce que « -config » est transitoire et qu'un emu.cfg où le
# propriétaire l'aurait éteint rendrait sinon deux images différentes selon
# l'historique de sa machine.
args = '-config config:rend.Resolution={height},rend.IntegerScale=no,rend.LinearInterpolation=yes'
fill = "ajuste"
